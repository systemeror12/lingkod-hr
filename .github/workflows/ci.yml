name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          version: 11.17.0
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @lingkod-hr/web exec playwright install --with-deps chromium
      - name: Start local infrastructure
        run: docker compose -f infrastructure/compose.yaml up -d --wait
      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://hris_app:local_app@localhost:55432/hris
          DATABASE_DIRECT_URL: postgresql://hris_migrator:local_migrator@localhost:55432/hris
          DATABASE_OPERATIONAL_URL: postgresql://hris_operator:local_operator@localhost:55432/hris
          DATABASE_MIGRATION_OWNER_URL: postgresql://hris_local:local_only@localhost:55432/hris
        run: pnpm db:migrate
      - name: Test Phase 3 acceptance gate
        env:
          DATABASE_URL: postgresql://hris_app:local_app@localhost:55432/hris
          DATABASE_DIRECT_URL: postgresql://hris_migrator:local_migrator@localhost:55432/hris
          DATABASE_OPERATIONAL_URL: postgresql://hris_operator:local_operator@localhost:55432/hris
          DATABASE_MIGRATION_OWNER_URL: postgresql://hris_local:local_only@localhost:55432/hris
          DATABASE_E2E: 'true'
          DATABASE_E2E_ADMIN_URL: postgresql://hris_local:local_only@localhost:55432/hris
        run: pnpm test:e2e:phase3
      - name: Validate repository
        env:
          DATABASE_URL: postgresql://hris_app:local_app@localhost:55432/hris
          DATABASE_DIRECT_URL: postgresql://hris_migrator:local_migrator@localhost:55432/hris
          DATABASE_OPERATIONAL_URL: postgresql://hris_operator:local_operator@localhost:55432/hris
          DATABASE_MIGRATION_OWNER_URL: postgresql://hris_local:local_only@localhost:55432/hris
          DATABASE_E2E: 'true'
          DATABASE_E2E_ADMIN_URL: postgresql://hris_local:local_only@localhost:55432/hris
        run: pnpm validate
      - name: Test protected browser entry
        env:
          DATABASE_URL: postgresql://hris_app:local_app@localhost:55432/hris
          DATABASE_DIRECT_URL: postgresql://hris_migrator:local_migrator@localhost:55432/hris
          DATABASE_OPERATIONAL_URL: postgresql://hris_operator:local_operator@localhost:55432/hris
          DATABASE_MIGRATION_OWNER_URL: postgresql://hris_local:local_only@localhost:55432/hris
          DATABASE_E2E: 'true'
          DATABASE_E2E_ADMIN_URL: postgresql://hris_local:local_only@localhost:55432/hris
        run: pnpm --filter @lingkod-hr/web test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3-browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
      - name: Stop local infrastructure
        if: always()
        run: docker compose -f infrastructure/compose.yaml down
