name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local infrastructure
        run: docker compose -f infrastructure/compose.yaml up -d --wait
      - name: Apply Prisma migrations
        env:
          DATABASE_URL: postgresql://hris_local:local_only@localhost:5432/hris
          DATABASE_DIRECT_URL: postgresql://hris_local:local_only@localhost:5432/hris
        run: pnpm db:migrate
      - name: Validate repository
        run: pnpm validate
      - name: Stop local infrastructure
        if: always()
        run: docker compose -f infrastructure/compose.yaml down
