/* Enterprise workbench tokens, copied from apps/web/src/app/globals.css. */
:root{--nav:#0f2240;--nav-ink:#e8eef7;--nav-muted:#93a3bd;--nav-focus:#6fa3ec;--canvas:#f2f4f7;--surface:#fff;--border:#d4d9e1;--border-subtle:#e6e9ee;--ink:#121a26;--ink-muted:#566175;--primary:#1a4fa0;--primary-hover:#153f80;--focus:#1a4fa0;--success:#1e6b3a;--warning:#9a6200;--danger:#a4262c;--neutral:#566175;--info:#1a4fa0;--gutter:24px}
*{box-sizing:border-box}
html{min-width:320px;color-scheme:light;font-family:'Noto Sans Variable','Noto Sans',sans-serif;background:var(--canvas);color:var(--ink)}
body{margin:0;min-height:100vh;font-size:.875rem;line-height:1.5}
button,input,select,textarea{font:inherit}
table{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
::selection{background:var(--primary);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-muted)}.cap{font-size:.75rem;line-height:1.4}.small{font-size:.8125rem}
.t-success{color:var(--success)}.t-warning{color:var(--warning)}.t-danger{color:var(--danger)}.t-muted{color:var(--ink-muted)}
.blk{display:block}.num{text-align:right;white-space:nowrap}.nowrap{white-space:nowrap}
p{margin:0}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.nav{background:var(--nav);color:var(--nav-ink);--focus:var(--nav-focus);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid rgb(255 255 255/10%)}
.nav-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgb(255 255 255/10%);font-weight:650;font-size:.875rem}
.nav-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:2px;background:var(--nav-focus);color:var(--nav);font-size:12px;font-weight:700}
.nav-toggle{display:none;margin-left:auto;cursor:pointer;border:1px solid rgb(255 255 255/20%);background:transparent;color:var(--nav-ink);border-radius:2px;padding:6px 12px;font-size:.8125rem;font-weight:600}
.nav-agency{padding:12px 16px;border-bottom:1px solid rgb(255 255 255/10%)}
.nav-agency span{display:block;font-size:.75rem;color:var(--nav-muted)}
.nav-agency strong{display:block;font-size:.8125rem;font-weight:600}
.nav-list{padding:8px;flex:1}
.nav-stage{padding:6px 8px;font-size:.8125rem;font-weight:600;color:var(--nav-muted);margin-top:2px}
.nav-stage.on{color:var(--nav-ink)}
.nav-list ul{list-style:none;margin:0 0 6px;padding:0}
.nav-link{display:block;padding:6px 8px 6px 20px;border-radius:2px;font-size:.8125rem;color:var(--nav-ink);text-decoration:none}
.nav-link:hover{background:rgb(255 255 255/6%)}
.nav-link[aria-current=page]{background:rgb(255 255 255/10%);font-weight:600;box-shadow:inset 0 0 0 1px rgb(255 255 255/14%)}
.nav-note{padding:8px 8px 0;font-size:.75rem;color:var(--nav-muted)}
.nav-user{border-top:1px solid rgb(255 255 255/10%);padding:12px 16px;display:flex;gap:10px;align-items:center}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:var(--nav-focus);color:var(--nav);display:grid;place-items:center;font-size:11px;font-weight:700}
.who strong{display:block;font-size:.8125rem;font-weight:600}.who span{display:block;font-size:.75rem;color:var(--nav-muted)}
@media (max-width:979px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;height:auto;border-right:0}
  .nav-toggle{display:inline-flex}
  .nav .nav-list,.nav .nav-agency,.nav .nav-user{display:none}
  .nav[data-open] .nav-list,.nav[data-open] .nav-agency,.nav[data-open] .nav-user{display:block}
  .nav[data-open] .nav-user{display:flex}
}
main{min-width:0;padding:24px var(--gutter) 112px;display:grid;gap:20px;align-content:start}
@media (max-width:620px){:root{--gutter:16px}}
.page-header{margin:-24px calc(var(--gutter)*-1) 0;background:var(--surface);border-bottom:1px solid var(--border);padding:20px var(--gutter) 0;min-width:0}
.crumbs{display:flex;gap:6px;list-style:none;margin:0;padding:0;font-size:.75rem;color:var(--ink-muted)}
.title-row{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 24px;padding:4px 0 20px}
h1{margin:0;font-size:1.375rem;line-height:1.2;font-weight:650;letter-spacing:-.01em}
h2,h3,h4{margin:0;font-size:.875rem;line-height:1.4;font-weight:650}
.lede{max-width:780px;font-size:.8125rem;color:var(--ink-muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.viewsw{display:flex;gap:2px;border:1px solid var(--border);background:var(--surface);padding:2px;border-radius:2px}
.viewsw button{cursor:pointer;border:0;background:transparent;border-radius:2px;padding:6px 12px;font-size:.75rem;font-weight:650;color:var(--ink-muted)}
.viewsw button:hover{color:var(--ink)}
.viewsw button[aria-pressed=true]{background:var(--canvas);color:var(--ink)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border:1px solid transparent;border-radius:2px;font-size:.8125rem;font-weight:600;white-space:nowrap;cursor:pointer;text-decoration:none;background:transparent;color:var(--ink-muted)}
.btn:hover{background:var(--canvas);color:var(--ink)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-secondary{background:var(--surface);border-color:var(--primary);color:var(--primary)}
.btn-secondary:hover{background:var(--canvas);color:var(--primary)}
.btn-danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:#fbf1f1;color:var(--danger)}
.btn-solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-solid-danger:hover{background:#8a1f24;color:#fff}
.btn-sm{min-height:30px;padding:0 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{cursor:pointer;border:0;background:transparent;padding:0;color:var(--primary);font-weight:600;text-align:left;font-size:inherit;line-height:inherit}
.linkbtn:hover{text-decoration:underline;text-underline-offset:2px}
.field{display:grid;gap:4px;font-size:.75rem;font-weight:650;color:var(--ink);min-width:0}
.input{min-height:36px;width:100%;border-radius:2px;border:1px solid var(--border);background:var(--surface);padding:0 10px;font-size:.875rem;font-weight:400;color:var(--ink);outline:none}
textarea.input{padding:8px 10px;min-height:72px;resize:vertical}
.input:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.input[aria-invalid=true]{border-color:var(--danger)}
.hint{font-size:.75rem;font-weight:400;color:var(--ink-muted)}
.err{font-size:.75rem;font-weight:400;color:var(--danger)}

/* Panel, table, tag */
.panel{min-width:0;border:1px solid var(--border);border-radius:2px;background:var(--surface)}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;min-height:44px;padding:8px 16px;border-bottom:1px solid var(--border)}
.panel-body{padding:16px}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.filters .field{width:220px;max-width:100%}
.scroll{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse;font-size:.8125rem}
.tbl th[scope=col]{border-bottom:1px solid var(--border);background:var(--canvas);padding:8px 16px;text-align:left;font-size:.75rem;font-weight:650;color:var(--ink);white-space:nowrap}
.tbl th[scope=col].num,.tbl td.num{text-align:right}
.tbl td,.tbl th[scope=row]{border-bottom:1px solid var(--border-subtle);padding:10px 16px;vertical-align:top;text-align:left}
.tbl th[scope=row]{font-weight:600}
.tbl tbody tr:hover{background:var(--canvas)}
.tbl tr[aria-current=true]{background:rgb(26 79 160/8%);box-shadow:inset 3px 0 0 var(--primary)}
.tbl tr.grp:hover{background:var(--canvas)}
.tbl tr.grp th{background:var(--canvas);border-bottom:1px solid var(--border);border-top:1px solid var(--border);padding:8px 16px;text-align:left;font-weight:650}
.tbl tr.flash td,.tbl tr.flash th{background:rgb(154 98 0/9%)}
.tag{display:inline-block;border:1px solid;border-radius:2px;padding:0 6px;font-size:.75rem;font-weight:600;white-space:nowrap;line-height:1.5}
.tag-success{border-color:var(--success);color:var(--success)}.tag-warning{border-color:var(--warning);color:var(--warning)}.tag-danger{border-color:var(--danger);color:var(--danger)}.tag-neutral{border-color:var(--neutral);color:var(--neutral)}.tag-info{border-color:var(--info);color:var(--info)}
.stack{display:grid;justify-items:start;gap:4px}
.surface{display:grid;justify-items:center;gap:6px;padding:40px 16px;text-align:center;color:var(--ink-muted);font-size:.8125rem}
.surface strong{color:var(--ink);font-size:.875rem;font-weight:650}
.surface.page{border:1px solid var(--border);background:var(--surface);border-radius:2px}
.msg{border-radius:2px;border:1px solid;padding:10px 12px;font-size:.8125rem}
.msg-success{border-color:rgb(30 107 58/40%);background:rgb(30 107 58/5%);color:var(--success)}
.msg-warning{border-color:rgb(154 98 0/45%);background:rgb(154 98 0/6%);color:#7a4e00}
.msg-danger{border-color:rgb(164 38 44/40%);background:rgb(164 38 44/5%);color:var(--danger)}
.msg-info{border-color:var(--border);background:var(--canvas);color:var(--ink-muted)}

/* Kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding:16px}
.col{display:grid;align-content:start;gap:8px;min-width:230px;flex:1;border:1px solid var(--border);border-radius:2px;background:var(--canvas);padding:12px}
.col h3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.75rem}
.card{display:grid;gap:4px;text-align:left;cursor:pointer;border:1px solid var(--border);border-radius:2px;background:var(--surface);padding:10px 12px;font-size:.8125rem;color:var(--ink)}
.card:hover{border-color:var(--primary)}
.card[aria-current=true]{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.card .k{font-size:.75rem;font-weight:650;color:var(--primary)}

/* Form record */
.rec{display:grid;gap:20px;padding:16px}
.rec-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px 24px}
.rec-title{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.rec-title h2{font-size:1.125rem;line-height:1.3}
.facts{display:flex;flex-wrap:wrap;gap:8px 40px;margin:14px 0 0}
.facts dt{font-size:.75rem;color:var(--ink-muted)}
.facts dd{margin:0;font-size:.875rem;font-weight:600}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);margin:0 -16px;padding:0 16px}
.tab{cursor:pointer;border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 16px;font-size:.8125rem;white-space:nowrap;color:var(--ink-muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{border-bottom-color:var(--primary);font-weight:650;color:var(--ink)}
.tab:focus-visible{outline-offset:-3px}
.sec{display:grid;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.dl{display:grid;gap:10px 24px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin:0}
.dl dt{font-size:.75rem;color:var(--ink-muted)}.dl dd{margin:0;font-size:.875rem}
.box{border:1px solid var(--border);border-radius:2px;background:var(--canvas);padding:12px 14px;display:grid;gap:6px;font-size:.8125rem}
.inset{border:1px solid var(--border);border-radius:2px;overflow:hidden}
.inset .tbl th[scope=col]{background:var(--canvas)}
.pager{display:flex;align-items:center;gap:6px}

/* Hour values: one cell per value, labelled with its source. */
.hours{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0}
.hour{border:1px solid var(--border);border-radius:2px;background:var(--canvas);padding:8px 12px;display:grid;gap:2px;align-content:start}
.hour dt{font-size:.75rem;font-weight:650;color:var(--ink)}
.hour dd{margin:0}
.hour .v{font-size:1rem;font-weight:650;font-variant-numeric:tabular-nums}
.hour .src{font-size:.75rem;color:var(--ink-muted)}
.hour.unknown .v{color:var(--ink-muted)}
.hour.pending{border-style:dashed;background:var(--surface)}
.hourkey summary{cursor:pointer;font-size:.8125rem;font-weight:600;color:var(--primary);width:max-content}
.hourkey dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 24px;margin:10px 0 0;font-size:.8125rem}
.hourkey dt{font-weight:650}.hourkey dd{margin:0;color:var(--ink-muted)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;gap:2px;font-size:.8125rem;border-left:2px solid var(--border);padding-left:12px}

/* Prototype controls sit outside the design. */
.proto{border:1px dashed #8a94a6;border-radius:2px;background:#fafbfc;padding:10px 14px;font-size:.8125rem}
.proto summary{cursor:pointer;font-weight:650}
.proto .grid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:10px}
.proto .field{width:220px}

/* Dialog */
dialog{border:1px solid var(--border);border-radius:2px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);color:var(--ink);box-shadow:0 18px 48px rgb(15 34 64/22%)}
dialog::backdrop{background:rgb(15 34 64/40%)}
.dlg{display:grid;max-height:calc(100vh - 50px)}
.dlg-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:grid;gap:4px}
.dlg-head h2{font-size:1rem}
.dlg-body{padding:16px 20px;display:grid;gap:14px;overflow-y:auto}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--canvas)}
.opts{display:grid;gap:8px;border:0;margin:0;padding:0}
.opts legend{font-size:.75rem;font-weight:650;margin-bottom:4px;padding:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;font-size:.8125rem;font-weight:400;border:1px solid var(--border);border-radius:2px;padding:8px 10px}
.opt input{margin:3px 0 0}
.opt .hint{grid-column:2}
.opt.off{background:var(--canvas)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


/* ---- Payroll additions (#327). Same tokens; nothing here adds a color. ---- */
.nav-inert{padding:4px 8px 4px 20px;font-size:.75rem;color:var(--nav-muted)}

/* Stage rail: one cell per stage. A stage that hasn't happened is dashed and says so in words. */
.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.stage{border:1px solid var(--border);border-radius:2px;background:var(--canvas);padding:8px 12px;display:grid;gap:2px;align-content:start;min-width:0}
.stage .k{font-size:.75rem;font-weight:650;color:var(--ink-muted)}
.stage .v{font-size:.875rem;font-weight:650}
.stage .w{font-size:.75rem;color:var(--ink-muted)}
.stage.done{border-left:3px solid var(--ink)}
.stage.final{border-left:3px solid var(--success)}
.stage.final .v{color:var(--success)}
.stage.todo{border-style:dashed;background:var(--surface)}
.stage.todo .v{color:var(--ink-muted);font-weight:600}
.stage.next .v{color:var(--warning)}
.stage.void .v{color:var(--danger)}
.stage ul{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:2px;font-size:.75rem}

/* Money */
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0}
.total{border:1px solid var(--border);border-radius:2px;background:var(--canvas);padding:8px 12px;display:grid;gap:2px;align-content:start}
.total dt{font-size:.75rem;font-weight:650}
.total dd{margin:0}
.total .v{font-size:1rem;font-weight:650;font-variant-numeric:tabular-nums}
.total .src{font-size:.75rem;color:var(--ink-muted)}
.total.pending{border-style:dashed;background:var(--surface)}
.total.pending .v{color:var(--ink-muted)}
.total.net{border-left:3px solid var(--primary)}
.prov{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.75rem;color:var(--ink-muted);min-width:220px;max-width:360px}
.prov strong{color:var(--ink);font-weight:600}
.tbl tfoot td,.tbl tfoot th{border-top:1px solid var(--border);border-bottom:0;padding:10px 16px;font-weight:650;background:var(--canvas);text-align:left}
.tbl tfoot td.num{text-align:right}
.tbl tr.sub th{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;font-size:.75rem;font-weight:650;color:var(--ink-muted);text-align:left}
.check{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.box h3,.box h4{font-size:.8125rem}
.box.todo{border-style:dashed;background:var(--surface)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.back{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.8125rem}
.lines-key{font-size:.75rem;color:var(--ink-muted)}

/* Employee payslip */
.slip{max-width:820px;display:grid;gap:16px}
.slip-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:flex-start}
.slip-net{border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:2px;padding:10px 14px;display:grid;gap:2px;min-width:200px}
.slip-net .v{font-size:1.375rem;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.slip-cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.slip-line{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:.8125rem}
.slip-line .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.slip-line .how{grid-column:1/-1;font-size:.75rem;color:var(--ink-muted)}
.slip-line details{grid-column:1/-1;font-size:.75rem}
.slip-line summary{cursor:pointer;color:var(--primary);font-weight:600;width:max-content}
.slip-sum{display:grid;grid-template-columns:1fr auto;gap:16px;padding:8px 0;font-weight:650;font-size:.8125rem}
.slip-sum .amt{font-variant-numeric:tabular-nums}
.month-pick{display:flex;flex-wrap:wrap;gap:6px}
.month-pick button{cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:2px;padding:6px 12px;font-size:.8125rem;font-weight:600;color:var(--ink-muted)}
.month-pick button[aria-pressed=true]{border-color:var(--primary);color:var(--primary);box-shadow:inset 0 -2px 0 var(--primary)}

/* Variant switcher: prototype chrome, kept apart from the design. */
.switcher{position:fixed;right:12px;bottom:12px;z-index:50;display:flex;align-items:center;gap:2px;padding:4px;border:1px dashed #8a94a6;border-radius:999px;background:#fafbfc;box-shadow:0 4px 14px rgb(15 34 64/16%);font-size:.75rem;font-weight:650;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.switcher span{padding:0 6px 0 8px;color:#4a5568}
.switcher a{display:grid;place-items:center;min-width:30px;height:30px;padding:0 9px;border-radius:999px;color:#1a4fa0;text-decoration:none}
.switcher a:hover{background:#e8edf5}
.switcher a[aria-current=page]{background:#121a26;color:#fff}
@media (max-width:420px){.switcher span{display:none}}
@media print{.switcher,.proto{display:none}}

/* ---------- actions ---------- */
// One person, one function per Payroll Period, across every calculation version (#330). No warning mode and no override.
function takeFunction(p, fn) {
  const who = me().person, have = p.actors[who];
  if (have && have !== fn) { flash(`Refused: ${who} already acted in ${FUNCTIONS[have]} on ${p.id}, and one person acts in one function per payroll.`, 'danger'); return false; }
  p.actors[who] = fn; return true;
}
const ACT = {
  calcStart(p) {
    if (!takeFunction(p, 'PREPARATION')) return;
    p.status = 'CALCULATING'; p.calcStarted = now();
    log(p, `Calculation ${p.v + 1} started; rule snapshot RS-${p.id.slice(0, 7)}-${p.v + 1} taken`);
    flash(`Calculation ${p.v + 1} started. ${p.id} has no results until it completes.`, 'warning');
  },
  calcFinish(p) {
    p.v += 1; p.status = 'FOR_REVIEW'; p.versions.push({ v: p.v, at: now(), by: 'System' });
    exceptionsOf(p).forEach(x => {
      if (x.status === 'RESOLVED') return;
      if (x.type === 'CANCELLED_INPUT_USED') Object.assign(x, { status: 'RESOLVED', by: 'System', at: now(), reason: `Calculation ${p.v} no longer uses PI-0931.` });
      else if (x.type === 'NO_PARTIAL_MONTH_RULE' && held(p, x.emp)) Object.assign(x, { status: 'RESOLVED', by: 'System', at: now(), reason: 'Held out under a Payroll Hold. No result in this payroll.' });
      else x.v = p.v;
    });
    const b = blockers(p).length;
    log(p, `Calculation ${p.v} completed${b ? ' with ' + count(b, 'blocking exception') : ''}`, '', 'System');
    flash(`Calculation ${p.v} completed. ${p.id} is For review${b ? ', with ' + count(b, 'blocking exception') + ' open' : ''}.`, b ? 'warning' : 'success');
  },
  returnForCorrection(p, reason) {
    p.status = 'DRAFT'; log(p, 'Returned for correction', reason);
    flash(`${p.id} returned to Draft. Calculation ${p.v} stays on record and is superseded when recalculated.`);
  },
  certify(p) {
    if (blockers(p).length) return flash(`Refused: ${count(blockers(p).length, 'blocking exception')} open. A blocking exception can’t be waived.`, 'danger');
    if (!takeFunction(p, 'HR_CERTIFICATION')) return;
    p.status = 'CERTIFIED'; p.cert = { by: me().person, at: now(), v: p.v };
    p.cpre = { id: `CPRE-${p.id}-${p.v}`, at: now(), v: p.v }; p.reviews = { budget: null, accounting: null };
    log(p, `Certified calculation ${p.v}; Certified Payroll Review Export ${p.cpre.id} generated`);
    flash(`Certified calculation ${p.v}. It is locked at that version. Budget and Accounting reviews are not recorded yet.`);
  },
  uncertify(p, reason, what) {
    if (p.cpre) p.cpre.superseded = true;
    p.status = 'FOR_REVIEW'; p.cert = null; p.reviews = { budget: null, accounting: null }; p.approval = null;
    log(p, what || 'Certification revoked', reason);
  },
  revoke(p, reason) { ACT.uncertify(p, reason); flash(`Certification revoked. ${p.id} is For review again; its review export is superseded.`, 'warning'); },
  review(p, which, outcome, note) {
    if (!takeFunction(p, which === 'budget' ? 'BUDGET_REVIEW' : 'ACCOUNTING_REVIEW')) return;
    const label = which === 'budget' ? 'Budget' : 'Accounting';
    if (outcome === 'RETURNED') {
      ACT.uncertify(p, note, `${label} review returned ${p.cpre.id}. Certification revoked; the other review is revoked`);
      return flash(`${label} review returned. ${p.id} is For review again, and the returned snapshot can never be approved.`, 'warning');
    }
    p.reviews[which] = { outcome, by: me().person, at: now(), note };
    log(p, `${label} review confirmed against ${p.cpre.id}`, note);
    const other = p.reviews[which === 'budget' ? 'accounting' : 'budget'];
    flash(`${label} review confirmed. ${other ? 'Both reviews are confirmed; the payroll is not approved yet.' : 'The other review is not recorded yet.'}`);
  },
  approve(p) {
    if (!p.reviews.budget || !p.reviews.accounting) return flash('Refused: approval needs both checkpoint reviews confirmed.', 'danger');
    if (!takeFunction(p, 'APPROVAL')) return;
    p.status = 'APPROVED'; p.approval = { by: me().person, at: now() };
    log(p, `Approved calculation ${p.v}`);
    flash(`Approved. ${p.id} is not finalized yet: nothing is immutable and no payslip exists.`);
  },
  returnApproved(p, reason) { ACT.uncertify(p, reason, 'Returned before finalization. Certification and reviews revoked'); flash(`${p.id} returned to For review.`, 'warning'); },
  finalize(p) {
    if (!takeFunction(p, 'APPROVAL')) return;
    p.status = 'FINALIZED'; p.final = { by: me().person, at: now() };
    results(p).forEach(r => { p.payslips[r.emp] = { status: 'GENERATING', at: now() }; });
    const h = p.holds.filter(x => !x.lifted);
    log(p, 'Finalized. Lines are immutable; inputs consumed' + (h.length ? `; Payroll Adjustment opened for ${h.map(x => EMP[x.emp].name).join(', ')}` : ''));
    flash(`Finalized. ${count(results(p).length, 'payslip')} generating; none is ready or released yet.`);
  },
  jobsFinish(p) {
    Object.values(p.payslips).forEach(s => { if (s.status === 'GENERATING') s.status = 'READY'; });
    Object.values(p.outputs).forEach(o => { if (o.status === 'GENERATING') o.status = 'READY'; });
    flash('Background work finished. Generated payslips are Ready, not released.');
  },
  releaseAll(p) {
    if (!takeFunction(p, 'APPROVAL')) return;
    let n = 0; Object.values(p.payslips).forEach(s => { if (s.status === 'READY') { Object.assign(s, { status: 'RELEASED', at: now(), by: me().person }); n++; } });
    log(p, `Payslips released (${n})`); flash(`${count(n, 'payslip')} released. Release says nothing about payment.`);
  },
  withhold(p, emp, reason) {
    if (!takeFunction(p, 'APPROVAL')) return;
    Object.assign(p.payslips[emp], { status: 'WITHHELD', at: now(), by: me().person, reason });
    log(p, `Payslip withheld for ${EMP[emp].name}`, reason); flash(`Payslip withheld for ${EMP[emp].name}. Withholding never stops payment.`, 'warning');
  },
  releaseOne(p, emp) {
    if (!takeFunction(p, 'APPROVAL')) return;
    Object.assign(p.payslips[emp], { status: 'RELEASED', at: now(), by: me().person, reason: '' });
    log(p, `Payslip released for ${EMP[emp].name}`); flash(`Payslip released for ${EMP[emp].name}.`);
  },
  destFix(p) { p.missingDest = []; flash('Prototype: the destination is now on record in Personnel.'); },
  exportGenerate(p) {
    if ((p.missingDest || []).length) return flash(`Blocked: ${p.missingDest.map(e => EMP[e].name).join(', ')} has no designated disbursement destination. One missing destination blocks the whole export.`, 'danger');
    const rs = results(p).filter(r => r.net > 0);
    p.export = { id: `PEX-${p.id}-1`, at: now(), by: me().person, checksum: 'sha256 ' + fakeHash(p.id + 'pex'), instructions: rs.map((r, i) => ({ id: `PIN-${p.id.slice(2, 7).replace('-', '')}${p.kind ? p.kind[0] : ''}-${String(i + 1).padStart(2, '0')}`, emp: r.emp, outcomes: [] })) };
    log(p, `Payment Export ${p.export.id} generated`); flash(`Payment Export generated with ${count(rs.length, 'Payment Instruction')}. No one is marked paid.`);
  },
  outcome(p, id, status, ref, note) {
    if (!takeFunction(p, 'DISBURSEMENT')) return;
    const i = p.export.instructions.find(x => x.id === id);
    i.outcomes.push({ status, at: now(), by: me().person, ref, note });
    log(p, `Disbursement Outcome ${status} recorded for ${EMP[i.emp].name}`, note); flash(`Outcome ${OUTCOME[status][0]} recorded for ${EMP[i.emp].name}.`, status === 'REJECTED' ? 'warning' : 'success');
  },
  supersede(p, id) {
    if (!takeFunction(p, 'DISBURSEMENT')) return;
    const i = p.export.instructions.find(x => x.id === id), n = { id: i.id + '-R' + (p.export.instructions.filter(x => x.id.startsWith(i.id.split('-R')[0])).length), emp: i.emp, outcomes: [], supersedes: i.id };
    i.supersededBy = n.id; p.export.instructions.push(n);
    log(p, `Payment Instruction ${i.id} superseded by ${n.id}`); flash(`${n.id} replaces ${i.id}. It has no outcome yet.`, 'warning');
  },
  outputGenerate(p, k) { p.outputs[k] = { status: 'GENERATING', at: now(), by: me().person }; log(p, `${OUTPUTS[k]} requested`); flash(`${OUTPUTS[k]} is generating. It isn’t ready yet.`, 'warning'); },
  ack(x, reason) { Object.assign(x, { status: 'ACKNOWLEDGED', reason, by: me().person, at: now() }); log(period(x.period), `Warning ${x.id} acknowledged`, reason); flash(`${x.id} acknowledged.`); },
  hold(x, reason) {
    const p = period(x.period);
    if (!takeFunction(p, 'PREPARATION')) return;
    p.holds.push({ emp: x.emp, exc: x.id, reason, by: me().person, at: now() });
    log(p, `Payroll Hold placed on ${EMP[x.emp].name}`, reason);
    flash(`Payroll Hold placed. ${EMP[x.emp].name} has no result in ${p.id}; the held month is paid later as a Payroll Adjustment.`, 'warning');
  },
  liftHold(x) {
    const p = period(x.period), h = held(p, x.emp);
    h.lifted = now(); log(p, `Payroll Hold lifted for ${EMP[x.emp].name}`); flash('Payroll Hold lifted.');
  },
};

// Walk the November payroll to a stage with the real actions, so every stage's data stays consistent.
function jumpTo(stage) {
  const keepRole = S.role;
  D = seedData(); D.stage = stage;
  const p = period(NOV), as = (r, fn) => { S.role = r; fn(); };
  const order = ['DRAFT', 'CALCULATING', 'FOR_REVIEW', 'CERTIFIED', 'REVIEWED', 'APPROVED', 'FINALIZED', 'RELEASED'];
  const at = order.indexOf(stage);
  if (at >= 1) as('preparer', () => { ACT.hold(D.exceptions[1], 'No partial-month rule on file (#613). Pay the held month as an adjustment.'); ACT.ack(D.exceptions[2], 'HR confirmed the 1–15 Nov lock is scheduled for 24 Nov; its facts go to the December payroll.'); ACT.calcStart(p); });
  if (at >= 2) ACT.calcFinish(p);
  if (at >= 3) as('certifier', () => ACT.certify(p));
  if (at >= 4) { as('budget', () => ACT.review(p, 'budget', 'CONFIRMED', '')); as('accounting', () => ACT.review(p, 'accounting', 'CONFIRMED', '')); }
  if (at >= 5) as('approver', () => ACT.approve(p));
  if (at >= 6) as('approver', () => ACT.finalize(p));
  if (at >= 7) { ACT.jobsFinish(p); as('approver', () => ACT.releaseAll(p)); ACT.destFix(p); as('cashier', () => ACT.exportGenerate(p)); }
  S.role = keepRole; S.flash = null; S.focus = null;
  save();
}

const who = (o, verb) => o ? `${verb ? verb + ' by ' : ''}${esc(o.by)} · ${dtt(o.at)}` : '';

/* ---------- the stage rail: calculated, certified, reviewed, approved, finalized ---------- */
function stageRail(p) {
  const cell = (k, cls, v, w) => `<li class="stage ${cls}"><span class="k">${k}</span><span class="v">${v}</span><span class="w">${w}</span></li>`;
  const cur = p.versions.find(x => x.v === p.v), out = [];
  const voided = p.status === 'VOIDED';
  if (p.status === 'CALCULATING') out.push(cell('Calculated', 'todo next', `Calculation ${p.v + 1} running`, `No results yet · started ${dtt(p.calcStarted)}`));
  else if (!p.v) out.push(cell('Calculated', 'todo next', 'Not calculated', 'Waiting on the Payroll Preparer'));
  else if (p.status === 'DRAFT') out.push(cell('Calculated', 'todo next', `Calculation ${p.v} returned`, 'On record; superseded when recalculated'));
  else out.push(cell('Calculated', 'done', `Calculation ${p.v}`, `${dtt(cur.at)} · hash ${totals(p).hash}`));
  out.push(p.cert ? cell('Certified', 'done', 'Certified', `${esc(p.cert.by)} · ${dtt(p.cert.at)} · locks calculation ${p.cert.v}`)
    : cell('Certified', 'todo' + (p.status === 'FOR_REVIEW' ? ' next' : ''), 'Not certified', p.status === 'FOR_REVIEW' ? (blockers(p).length ? `Blocked by ${count(blockers(p).length, 'exception')}` : 'Waiting on the HR Certifying Officer') : 'Needs a completed calculation'));
  const rv = (label, r) => `<li>${label}: ${r ? `<strong>Confirmed</strong> · ${esc(r.by)} · ${dtt(r.at)}` : 'no review recorded'}</li>`;
  const n = (p.reviews.budget ? 1 : 0) + (p.reviews.accounting ? 1 : 0);
  out.push(cell('Reviewed', n === 2 ? 'done' : 'todo' + (p.status === 'CERTIFIED' ? ' next' : ''), n === 2 ? 'Both reviews confirmed' : n === 1 ? '1 of 2 reviews confirmed' : 'Not reviewed',
    `<ul>${rv('Budget', p.reviews.budget)}${rv('Accounting', p.reviews.accounting)}</ul>`));
  out.push(p.approval ? cell('Approved', 'done', 'Approved', `${esc(p.approval.by)} · ${dtt(p.approval.at)}`)
    : cell('Approved', 'todo' + (p.status === 'CERTIFIED' && n === 2 ? ' next' : ''), 'Not approved', p.status === 'CERTIFIED' && n === 2 ? 'Waiting on the Payroll Approver' : 'Needs both reviews confirmed'));
  out.push(p.final ? cell('Finalized', voided ? 'done' : 'final', voided ? 'Was finalized' : 'Finalized', `${esc(p.final.by)} · ${dtt(p.final.at)} · ${voided ? 'since voided' : 'immutable'}`)
    : cell('Finalized', 'todo' + (p.status === 'APPROVED' ? ' next' : ''), 'Not finalized', p.status === 'APPROVED' ? 'Waiting on the Payroll Approver' : 'Needs approval'));
  if (voided) out.push(cell('Voided', 'done void', 'Voided', `${esc(p.voided.by)} · ${dtt(p.voided.at)}`));
  return `<ol class="rail" aria-label="Stages of ${esc(p.id)}">${out.join('')}</ol>`;
}
function statusCell(p) { const [t, tone] = pendingWith(p); return `<div class="stack">${tag(PERIOD_STATUS[p.status])}<span class="cap t-${tone === 'muted' ? 'muted' : tone}">${esc(t)}</span></div>`; }
function calcLabel(p) { return p.status === 'CALCULATING' ? `${p.v + 1} running` : p.v ? String(p.v) : 'Not calculated'; }
function netCell(p) {
  if (!p.v) return '<span class="muted">—</span>';
  const t = totals(p), note = p.status === 'FINALIZED' ? '' : p.status === 'VOIDED' ? 'voided' : p.status === 'CALCULATING' ? `calculation ${p.v}, superseded` : p.status === 'DRAFT' ? `calculation ${p.v}, returned` : `calculation ${p.v}, not final`;
  return `${peso(t.net)}${note ? `<span class="blk cap muted">${note}</span>` : ''}`;

/* ---------- period actions ---------- */
function periodActions(p) {
  const a = [], why = [];
  const B = (label, act, kind, off) => a.push(`<button type="button" class="btn ${kind || 'btn-secondary'}" data-act="${act}" data-id="${p.id}" data-fid="${act}:${p.id}" ${off ? 'disabled' : ''}>${label}</button>`);
  if (p.status === 'DRAFT' && can('periods.calculate')) {
    B(p.v ? `Recalculate as calculation ${p.v + 1}` : 'Start calculation', 'calc-start', 'btn-primary');
    const open = blockers(p).filter(x => x.type === 'NO_PARTIAL_MONTH_RULE' && !held(p, x.emp));
    if (open.length) why.push(`${open[0].id} is open with no Payroll Hold. Calculating now raises it again.`);
  }
  if (p.status === 'FOR_REVIEW') {
    const b = blockers(p).length;
    if (can('periods.certify')) { B(`Certify calculation ${p.v}`, 'certify', 'btn-primary', b > 0); if (b) why.push(`Certify is off: ${count(b, 'blocking exception')} open, and a blocking exception can’t be waived.`); }
    if (can('periods.return')) B('Return for correction', 'return');
  }
  if (p.status === 'CERTIFIED') {
    [['budget', 'periods.review_funding', 'Budget'], ['accounting', 'periods.review_accounting', 'Accounting']].forEach(([k, perm, label]) => {
      if (!can(perm)) return;
      if (p.reviews[k]) why.push(`Your ${label} review is recorded. A review can’t be changed.`);
      else { B(`Confirm ${label} review`, k + '-confirm', 'btn-primary'); B('Return this snapshot', k + '-return', 'btn-danger'); }
    });
    if (can('periods.approve')) {
      const need = [!p.reviews.budget && 'Budget', !p.reviews.accounting && 'Accounting'].filter(Boolean);
      B('Approve payroll', 'approve', 'btn-primary', need.length > 0);
      if (need.length) why.push(`Approve is off: the ${need.join(' and ')} ${need.length > 1 ? 'reviews are' : 'review is'} not recorded.`);
    }
    if (can('periods.revoke_certification')) B('Revoke certification', 'revoke', 'btn-danger');
  }
  if (p.status === 'APPROVED' && can('periods.finalize')) { B('Finalize payroll', 'finalize', 'btn-primary'); B('Return before finalization', 'return-approved', 'btn-danger'); }
  return a.length || why.length ? `<div class="sec"><div class="actions">${a.join('')}</div>${why.map(w => `<p class="cap muted">${esc(w)}</p>`).join('')}</div>` : '';
}
function protoJobs(p) {
  const gen = Object.values(p.payslips).some(s => s.status === 'GENERATING') || Object.values(p.outputs).some(o => o.status === 'GENERATING');
  if (p.status !== 'CALCULATING' && !gen) return '';
  return `<div class="proto"><div class="actions"><span><strong>Prototype control.</strong> The API finishes this work in the background.</span>
    ${p.status === 'CALCULATING' ? btn(`Let calculation ${p.v + 1} finish`, 'calc-finish', p.id) : btn('Let generation finish', 'jobs-finish', p.id)}</div></div>`;
}
function periodFacts(p) {
  const f = [['Run type', p.run === 'REGULAR' ? 'Regular' : 'Special'], ['Coverage', range(p.from, p.to)], ['Cutoff', dtt(p.cutoff)], ['Payment date', dt(p.pay)], ['Calculation version', calcLabel(p)], ['Employees', p.emps.length]];
  if (p.components) f.push(['Pays', p.components.join(', ')]);

function totalsBlock(p, v) {
  if (!p.v) return `<dl class="totals">${['Gross pay', 'Deductions', 'Net pay', 'Government share'].map(k => `<div class="total pending"><dt>${k}</dt><dd class="v">Not calculated</dd><dd class="src">No calculation has completed</dd></div>`).join('')}</dl>`;
  const t = totals(p, v), vv = v || p.v;
  const src = p.status === 'FINALIZED' ? `Finalized · calculation ${vv}` : p.status === 'VOIDED' ? 'Voided payroll' : p.status === 'CALCULATING' || p.status === 'DRAFT' || vv !== p.v ? `Calculation ${vv} · superseded on recalculation` : `Calculation ${vv} · not final`;
  const pend = p.status === 'CALCULATING' || p.status === 'DRAFT' || vv !== p.v;
  const c = (k, n, cls) => `<div class="total ${pend ? 'pending' : ''} ${cls || ''}"><dt>${k}</dt><dd class="v">${peso(n)}</dd><dd class="src">${src}</dd></div>`;
  return `<dl class="totals">${c('Gross pay', t.gross)}${c('Deductions', t.ded)}${c('Net pay', t.net, 'net')}${c('Government share', t.employer)}</dl>
    <p class="cap muted">${count(t.n, 'Employee result')}${p.emps.length - t.n ? ` · ${count(p.emps.length - t.n, 'Employee')} without a result` : ''} · hash ${t.hash}. Government share has no effect on net pay.</p>`;
}

/* ---------- Employee results and Payroll Lines ---------- */
function employeesSection(p) {
  const running = p.status === 'CALCULATING' ? `<div class="msg msg-warning" role="status">Calculation ${p.v + 1} is running and has no results yet.${p.v ? ` Calculation ${p.v} is shown below. It is superseded when the new one completes.` : ''}</div>` : '';
  if (!p.v) return running + surface('No results yet.', 'Employee results appear when the first calculation completes.');
  const v = S.ver && S.ver <= p.v ? +S.ver : p.v;
  const note = p.status === 'DRAFT' ? `<div class="msg msg-info" role="status">Returned for correction. Calculation ${p.v} stays on record and is superseded when recalculated.</div>` : '';
  const pick = p.versions.length > 1 ? `<label class="field" style="width:260px">Calculation version<select class="input" data-filter="ver" data-fid="filter-ver">${p.versions.slice().reverse().map(x => `<option value="${x.v}" ${x.v === v ? 'selected' : ''}>Calculation ${x.v} · ${x.v === p.v ? 'current' : 'superseded, kept on record'}</option>`).join('')}</select></label>` : '';
  const rows = p.emps.filter(e => matches(EMP[e].name + ' ' + EMP[e].no)).map(e => {
    const x = EMP[e], ex = excFor(p, e).filter(z => z.status === 'OPEN');
    const name = `<th scope="row">${openLink(x.name, V.openResult(p, e), 'emp-' + e)}<span class="blk cap muted" style="font-weight:400">${x.no} · ${esc(x.pos)}</span></th>`;
    if (!hasResult(p, e)) {
      const h = held(p, e);
      return `<tr>${name}<td>${tag(['No result', 'neutral'], true)}</td><td colspan="4" class="muted">${h ? `Held out under a Payroll Hold placed by ${esc(h.by)}. The held month is paid later as a Payroll Adjustment.` : `Blocked by ${ex.map(z => z.id).join(', ')}. No amount was calculated.`}</td></tr>`;
    }
    const r = result(p, e, v);
    return `<tr>${name}<td>${tag(v === p.v ? RESULT_STATUS[r.status] : ['Superseded', 'neutral'])}</td><td class="num">${peso(r.gross)}</td><td class="num">${peso(r.ded)}</td><td class="num"><strong>${peso(r.net)}</strong></td><td>${ex.length ? ex.map(z => `<span class="blk">${tag(SEVERITY[z.severity])} ${z.id}</span>`).join('') : '<span class="muted">None open</span>'}</td></tr>`;
  }).join('');
  const t = totals(p, v);
  return `${running}${note}<div class="row" style="align-items:flex-end;gap:12px">${search('Employee name or number')}${pick}</div>
    <div class="inset">${table('Employee results', 860, ['Employee', 'Result', '#Gross pay', '#Deductions', '#Net pay', 'Open exceptions'], rows || `<tr><td colspan="6" class="muted">No Employee matches.</td></tr>`,
    `<tr><th scope="row" colspan="2">${count(t.n, 'result')} · calculation ${v}</th><td class="num">${peso(t.gross)}</td><td class="num">${peso(t.ded)}</td><td class="num">${peso(t.net)}</td><td></td></tr>`)}</div>`;
}
const LINE_GROUPS = [['EARNING', 'Earnings · add to net pay'], ['DEDUCTION', 'Deductions · subtract from net pay'], ['EMPLOYER_SHARE', 'Government share · no effect on net pay'], ['INFORMATIONAL', 'Informational · no effect on net pay']];
function linesTable(r) {
  const rows = LINE_GROUPS.map(([type, label]) => {
    const ls = r.lines.filter(l => l.type === type);
    if (!ls.length) return '';
    return `<tr class="sub"><th colspan="6" scope="colgroup">${label}</th></tr>` + ls.map(l => `<tr><th scope="row">${esc(l.c)}</th><td class="nowrap">${esc(l.qty)}</td><td class="nowrap">${esc(l.rate)}</td><td class="num"><strong>${peso(l.amount)}</strong></td><td>${esc(l.rule)}</td><td><ul class="prov">${l.src.map(s => `<li>${esc(s)}</li>`).join('')}</ul></td></tr>`).join('');
  }).join('');
  return `<div class="inset">${table('Payroll Lines', 1040, ['Payroll Line', 'Quantity', 'Rate', '#Amount', 'Rule version', 'Source records'], rows,
    `<tr><th scope="row" colspan="3">Net pay = earnings − deductions</th><td class="num">${peso(r.net)}</td><td colspan="2"></td></tr>`)}</div>`;
}
function resultDetail(p, emp, v) {
  const e = EMP[emp], ex = excFor(p, emp);
  const head = `<div class="rec-title"><h3 style="font-size:1rem">${esc(e.name)}</h3>${hasResult(p, emp) ? '' : tag(['No result', 'neutral'], true)}</div>
    <p class="small muted">${e.no} · ${esc(e.pos)} · SG ${e.sg} Step ${e.step}${e.assumed ? ' · assumed duty ' + dt(e.assumed) : ''} · ${esc(p.id)}</p>`;
  const exc = ex.length ? `<div class="sec"><h3>Exceptions for this Employee</h3>${exceptionsTable(ex, {})}</div>` : '';
  if (!p.v) return head + surface('No result yet.', 'This payroll has not been calculated.');
  if (!hasResult(p, emp)) {
    const h = held(p, emp);
    return `${head}<div class="box todo"><strong>No result in this payroll.</strong><span>${h ? `Held out under a Payroll Hold: “${esc(h.reason)}” (${esc(h.by)}, ${dtt(h.at)}). When this payroll is finalized, a Payroll Adjustment opens to pay the held month.` : 'A blocking exception stopped the calculation for this Employee, so there are no Payroll Lines and no amounts.'}</span></div>${exc}`;
  }
  const r = result(p, emp, v || p.v), pend = r.v !== p.v || p.status === 'DRAFT' || p.status === 'CALCULATING';
  const src = pend ? `Calculation ${r.v} · superseded on recalculation` : p.status === 'FINALIZED' ? `Finalized · calculation ${r.v}` : `Calculation ${r.v} · not final`;
  const c = (k, n, cls) => `<div class="total ${pend ? 'pending' : ''} ${cls || ''}"><dt>${k}</dt><dd class="v">${peso(n)}</dd><dd class="src">${src}</dd></div>`;
  return `${head.replace('</h3>', `</h3>${tag(pend ? ['Superseded', 'neutral'] : RESULT_STATUS[r.status])}`)}
    <dl class="totals">${c('Gross pay', r.gross)}${c('Deductions', r.ded)}${c('Net pay', r.net, 'net')}${c('Government share', r.employer)}</dl>
    <div class="sec"><div class="sec-head"><h3>Payroll Lines</h3><span class="lines-key">Every line keeps its quantity, rate, rule version, and source. No line can be edited or overridden.</span></div>${linesTable(r)}
    <p class="cap muted">Result hash ${r.hash}. Recalculating from the same snapshot and inputs gives the same hash.</p></div>${exc}`;
}

/* ---------- exceptions ---------- */
function exceptionNeeds(x) {
  const p = period(x.period);
  if (x.status === 'RESOLVED') return `Resolved · ${esc(x.by)} · ${dtt(x.at)}<span class="blk">${esc(x.reason)}</span>`;
  if (x.status === 'ACKNOWLEDGED') return `Acknowledged · ${esc(x.by)} · ${dtt(x.at)}<span class="blk">“${esc(x.reason)}”</span>`;
  const h = x.emp && held(p, x.emp);
  if (h) return `Payroll Hold placed by ${esc(h.by)}. Clears at the next calculation.`;
  return esc(x.fix || '');
}
function exceptionActions(x) {
  const p = period(x.period);
  if (x.status !== 'OPEN' || !can('exceptions.manage')) return '';
  if (x.severity === 'WARNING') return btn('Acknowledge', 'exc-ack', x.id);
  if (x.type === 'NO_PARTIAL_MONTH_RULE') {
    if (p.status !== 'DRAFT') return '<span class="cap muted">A hold is placed only while the payroll is Draft.</span>';
    return held(p, x.emp) ? btn('Lift hold', 'hold-lift', x.id) : btn('Place Payroll Hold', 'hold-place', x.id, 'btn-primary');
  }
  return '';
}
function exceptionsTable(list, o) {
  const order = x => (x.status === 'OPEN' ? 0 : 2) + (x.severity === 'BLOCKING' ? 0 : 1);
  const rows = list.slice().sort((a, b) => order(a) - order(b)).map(x => `<tr id="row-${x.id}" ${x.id === S.record && S.dest === 'exceptions' ? 'aria-current="true"' : ''}>
    <th scope="row">${o.open ? openLink(x.id, o.open(x), 'exc-' + x.id) : x.id}<span class="blk" style="font-weight:400;max-width:340px">${esc(x.title)}</span></th>
    ${o.showPeriod ? `<td>${openLink(x.period, V.openPeriod(x.period), 'excp-' + x.id)}<span class="blk cap muted">calculation ${x.v}</span></td>` : ''}
    <td>${x.emp ? esc(EMP[x.emp].name) : 'Whole payroll'}</td>
    <td><div class="stack">${tag(SEVERITY[x.severity])}<span class="cap muted">${x.severity === 'BLOCKING' ? 'Stops certification. Can’t be waived.' : 'Doesn’t block. Acknowledge with a reason.'}</span></div></td>
    <td>${tag(EXC_STATUS[x.status])}</td>
    <td style="max-width:360px"><span class="small">${esc(x.detail)}</span><span class="blk cap muted" style="margin-top:4px">${exceptionNeeds(x)}</span></td>
    <td>${exceptionActions(x)}</td></tr>`).join('');
  return `<div class="inset">${table('Exceptions', o.showPeriod ? 1180 : 1040, ['Exception', ...(o.showPeriod ? ['Payroll Period'] : []), 'Applies to', 'Severity', 'Status', 'Reason and what it needs', 'Action'], rows)}</div>`;
}
function exceptionsSection(p) {
  const list = exceptionsOf(p);
  if (!list.length) return surface('No exceptions.', p.v ? `Calculation ${p.v} raised none.` : 'Exceptions are raised by a calculation.');
  const b = blockers(p).length, w = openWarnings(p).length;
  return `<p class="small ${b ? 't-danger' : 'muted'}">${b ? `<strong>${count(b, 'blocking exception')} open.</strong> This payroll can’t be certified until ${b === 1 ? 'it is' : 'they are'} resolved or the Employee is held out.` : 'No blocking exception is open.'} ${w ? count(w, 'warning') + ' not acknowledged.' : ''}</p>${exceptionsTable(list, {})}`;
}

/* ---------- certification, checkpoint reviews, approval, finalization ---------- */
function reviewSection(p) {
  const box = (title, done, label, body) => `<div class="box ${done ? '' : 'todo'}"><div class="sec-head"><h3>${title}</h3>${tag(label, !done)}</div>${body}</div>`;
  const t = p.v ? totals(p) : null;
  const rv = (k, label, role) => {
    const r = p.reviews[k];
    return box(`${label} checkpoint review`, !!r, r ? ['Confirmed', 'info'] : [p.cpre && !p.cpre.superseded ? 'No review recorded' : 'Not open', 'neutral'],
      r ? `<span>${who(r, 'Confirmed')}</span><span class="muted">Against ${p.cpre.id}. It confirms that exact snapshot and asserts no external posting.</span>`
        : `<span class="muted">${p.status === 'CERTIFIED' ? `Waiting on the ${role}. A reviewer who is only waiting records nothing.` : 'Opens when the payroll is certified and its review export exists.'}</span>`);
  };
  const actors = Object.entries(FUNCTIONS).map(([k, l]) => { const person = Object.keys(p.actors).find(n => p.actors[n] === k); return `<tr><th scope="row">${l}</th><td>${person ? esc(person) : '<span class="muted">No one has acted yet</span>'}</td></tr>`; }).join('');
  return `<div class="check">
    ${box('HR certification', !!p.cert, p.cert ? ['Certified', 'info'] : ['Not certified', 'neutral'], p.cert ? `<span>${who(p.cert, 'Certified')}</span><span class="muted">Locks calculation ${p.cert.v} · hash ${t.hash}. Personnel, attendance, and leave inputs.</span>` : `<span class="muted">${p.status === 'FOR_REVIEW' ? (blockers(p).length ? `Blocked: ${count(blockers(p).length, 'blocking exception')} open.` : 'Waiting on the HR Certifying Officer.') : 'Needs a completed calculation that is For review.'}</span>`)}
    ${box('Certified Payroll Review Export', !!p.cpre && !p.cpre.superseded, p.cpre ? (p.cpre.superseded ? ['Superseded', 'neutral'] : ['Generated', 'info']) : ['Not generated', 'neutral'], p.cpre ? `<span>${p.cpre.id} · ${dtt(p.cpre.at)} · calculation ${p.cpre.v}</span><span class="muted">${p.cpre.superseded ? 'Superseded when certification was revoked. Its reviews are revoked.' : 'One immutable snapshot for both reviews. It asserts no fund validation, obligation, or accounting posting.'}</span>` : '<span class="muted">Generated at certification, from the certified calculation.</span>')}
    ${rv('budget', 'Budget', 'Budget Officer')}${rv('accounting', 'Accounting', 'Accounting Reviewer')}
    ${box('Approval', !!p.approval, p.approval ? ['Approved', 'info'] : ['Not approved', 'neutral'], p.approval ? `<span>${who(p.approval, 'Approved')}</span><span class="muted">Approved is not finalized: lines aren’t immutable yet and no output exists.</span>` : '<span class="muted">Needs certification and both checkpoint reviews confirmed.</span>')}
    ${box('Finalization', !!p.final, p.final ? (p.status === 'VOIDED' ? ['Voided after finalization', 'danger'] : ['Finalized', 'success']) : ['Not finalized', 'neutral'], p.final ? `<span>${who(p.final, 'Finalized')}</span><span class="muted">${p.status === 'VOIDED' ? `Voided ${dtt(p.voided.at)} by ${esc(p.voided.by)}. The original stays readable.` : 'Lines are immutable. Every correction is a later linked record.'}</span>` : '<span class="muted">Checks the approved hash, open exceptions, and line totals in one transaction, then fails if anything changed after approval.</span>')}
  </div>
  <div class="sec"><div class="sec-head"><h3>One person, one function on this payroll</h3><span class="lines-key">A second function is refused, with no override.</span></div>
  <div class="inset">${table('Functions on this payroll', 420, ['Function', 'Person'], actors)}</div></div>`;
}

/* ---------- payslips ---------- */
function payslipsSection(p) {
  if (p.status !== 'FINALIZED' && p.status !== 'VOIDED') return surface('No payslips yet.', `Payslips are generated after finalization. ${esc(p.id)} is ${PERIOD_STATUS[p.status][0]}.`);
  const c = slipCounts(p), ready = c.READY;
  const rows = Object.entries(p.payslips).map(([e, s]) => {
    const r = result(p, e);
    let act = '';
    if (s.status === 'READY' && can('payslips.withhold')) act = btn('Withhold', 'slip-withhold', p.id + '|' + e, 'btn-danger');
    if (s.status === 'WITHHELD' && can('payslips.release')) act = btn('Release', 'slip-release', p.id + '|' + e);
    const when = s.status === 'RELEASED' ? who(s, 'Released') : s.status === 'WITHHELD' ? `${who(s, 'Withheld')}<span class="blk muted">“${esc(s.reason)}”</span>` : s.status === 'GENERATING' ? '<span class="muted">The PDF isn’t stored yet.</span>' : s.status === 'READY' ? '<span class="muted">Stored. The Employee can’t read it until it is released.</span>' : '<span class="muted">Superseded when the payroll was voided.</span>';
    return `<tr><th scope="row">${esc(EMP[e].name)}<span class="blk cap muted" style="font-weight:400">${EMP[e].no}</span></th><td class="num">${peso(r.net)}</td><td>${tag(SLIP_STATUS[s.status])}</td><td class="small">${when}</td><td>${act}</td></tr>`;
  }).join('');
  const summary = Object.entries(c).filter(([, n]) => n).map(([k, n]) => `${SLIP_STATUS[k][0]} ${n}`).join(' · ');
  return `<div class="sec-head"><p class="small"><strong>${summary}</strong><span class="blk cap muted">Release is one command for every Ready payslip. It doesn’t wait on Disbursement Outcomes, and withholding a payslip never stops payment.</span></p>
    ${can('payslips.release') ? `<button type="button" class="btn btn-primary" data-act="slip-release-all" data-id="${p.id}" data-fid="slip-release-all:${p.id}" ${ready ? '' : 'disabled'}>Release ${ready ? count(ready, 'Ready payslip') : 'payslips'}</button>` : ''}</div>
    <div class="inset">${table('Payslips', 760, ['Employee', '#Net pay', 'Payslip', 'Released or withheld', 'Action'], rows)}</div>`;
}

/* ---------- Payment Export and Disbursement Outcomes ---------- */
function paymentSection(p) {
  if (p.status === 'VOIDED') return surface('No Payment Export.', 'This payroll was voided before any Payment Export was generated.');
  if (p.status !== 'FINALIZED') return surface('No Payment Export yet.', `A Payment Export comes only from a finalized payroll. ${esc(p.id)} is ${PERIOD_STATUS[p.status][0]}.`);
  if (!p.export) {
    const miss = p.missingDest || [];
    return `<div class="box todo"><div class="sec-head"><h3>Payment Export</h3>${tag(['Not generated', 'neutral'], true)}</div>
      <span class="muted">One Payment Instruction per positive net pay. Generating it marks no one paid.</span>
      ${miss.length ? `<div class="msg msg-danger" role="status"><strong>Blocked.</strong> ${miss.map(e => esc(EMP[e].name)).join(', ')} has no designated disbursement destination. One missing destination blocks the whole export.</div>
        <div class="proto"><div class="actions"><span><strong>Prototype control.</strong> The destination is recorded in Personnel.</span>${btn('Record the destination', 'dest-fix', p.id)}</div></div>` : ''}
      ${can('exports.generate') ? `<div class="actions"><button type="button" class="btn btn-primary" data-act="export-generate" data-id="${p.id}" data-fid="export-generate:${p.id}">Generate Payment Export</button></div>` : '<span class="cap muted">Your role can’t generate the Payment Export.</span>'}</div>`;
  }
  const x = p.export, live = liveInstructions(p), by = {};
  live.forEach(i => { by[latest(i)] = (by[latest(i)] || 0) + 1; });
  const amount = i => result(p, i.emp).net, settled = sum(live.filter(i => latest(i) === 'SETTLED'), amount), total = sum(live, amount);
  const rows = x.instructions.map(i => {
    const l = latest(i), act = [];
    if (!i.supersededBy && can('disbursement.update')) {
      if (l !== 'SETTLED' && l !== 'REJECTED') act.push(btn('Record outcome', 'outcome', p.id + '|' + i.id));
      if (l === 'REJECTED') act.push(btn('Supersede instruction', 'supersede', p.id + '|' + i.id, 'btn-primary'));
    }
    return `<tr><th scope="row">${i.id}<span class="blk cap muted" style="font-weight:400">${esc(EMP[i.emp].name)}${i.supersedes ? ' · replaces ' + i.supersedes : ''}</span></th><td>${EMP[i.emp].acct}</td><td class="num">${peso(amount(i))}</td>
      <td>${i.supersededBy ? tag(['Superseded by ' + i.supersededBy, 'neutral']) : tag(OUTCOME[l], l === 'NONE')}</td>
      <td><ol class="prov" style="list-style:decimal;padding-left:16px">${i.outcomes.length ? i.outcomes.map(o => `<li><strong>${OUTCOME[o.status][0]}</strong> · ${dtt(o.at)} · ${esc(o.ref || 'no reference')}${o.note ? ' · ' + esc(o.note) : ''}</li>`).join('') : '<li style="list-style:none;margin-left:-16px">None recorded. Not paid.</li>'}</ol></td>
      <td><div class="actions">${act.join('')}</div></td></tr>`;
  }).join('');
  return `<dl class="dl"><div><dt>Payment Export</dt><dd>${x.id}</dd></div><div><dt>Generated</dt><dd>${who(x)}</dd></div><div><dt>Checksum</dt><dd>${x.checksum}</dd></div><div><dt>From</dt><dd>${esc(p.id)} · finalized calculation ${p.v}</dd></div></dl>
    <div class="msg msg-info" role="status">Generating this export marked no one paid. Each Payment Instruction is paid only when a <strong>Settled</strong> outcome is recorded: <strong>${peso(settled)}</strong> of ${peso(total)} settled.
      ${Object.entries(by).map(([k, n]) => `${OUTCOME[k][0]} ${n}`).join(' · ')}.</div>
    <div class="inset">${table('Payment Instructions', 1040, ['Payment Instruction', 'Destination', '#Amount', 'Latest outcome', 'Disbursement Outcomes, in order', 'Action'], rows)}</div>`;
}

/* ---------- register, reports, schedules, exports ---------- */
function reportsSection(p) {
  const rows = [];
  if (p.cpre) rows.push(`<tr><th scope="row">Certified Payroll Review Export<span class="blk cap muted" style="font-weight:400">${p.cpre.id}</span></th><td>${tag(p.cpre.superseded || p.status === 'VOIDED' ? OUTPUT_STATUS.SUPERSEDED : OUTPUT_STATUS.READY)}</td><td class="small">${dtt(p.cpre.at)} · at certification</td><td class="small">Certified calculation ${p.cpre.v}</td><td>${p.cpre.superseded ? '' : btn('Download', 'download', p.cpre.id)}</td></tr>`);
  if (p.status === 'FINALIZED' || p.status === 'VOIDED') Object.entries(OUTPUTS).forEach(([k, label]) => {
    const o = p.outputs[k], st = p.status === 'VOIDED' ? (o ? 'SUPERSEDED' : 'NONE') : o ? o.status : 'NONE';
    const act = st === 'READY' ? btn('Download', 'download', label) : st === 'NONE' && p.status === 'FINALIZED' && can('outputs.generate') ? btn('Generate', 'output-generate', p.id + '|' + k) : '';
    rows.push(`<tr><th scope="row">${label}</th><td>${tag(OUTPUT_STATUS[st], st === 'NONE')}</td><td class="small">${o ? who(o) : '<span class="muted">—</span>'}${st === 'GENERATING' ? '<span class="blk muted">Requested. The file isn’t stored yet.</span>' : ''}</td><td class="small">${o ? `${esc(p.id)} · finalized calculation ${p.v}` : '<span class="muted">—</span>'}</td><td>${act}</td></tr>`);
  });
  const pre = p.status !== 'FINALIZED' && p.status !== 'VOIDED' ? `<div class="msg msg-info" role="status">The register, variance report, remittance schedules, and accounting export come only from a finalized payroll. ${esc(p.id)} is ${PERIOD_STATUS[p.status][0]}.</div>` : '';
  return `${pre}${rows.length ? `<div class="inset">${table('Outputs', 860, ['Output', 'Status', 'Generated', 'From', 'Action'], rows.join(''))}</div>` : surface('No outputs yet.', 'The review export appears at certification. Everything else follows finalization.')}
    <p class="cap muted">These are LingkodHR’s own reports and Structured Exports. None claims to be a COA or BIR form (#617).</p>`;
}
function historySection(p) {
  return `<div class="sec"><h3>Calculation versions</h3><div class="inset">${table('Calculation versions', 520, ['Version', 'Completed', 'State'], p.versions.length ? p.versions.slice().reverse().map(x => `<tr><th scope="row">Calculation ${x.v}</th><td>${dtt(x.at)}</td><td>${x.v === p.v ? (p.status === 'DRAFT' || p.status === 'CALCULATING' ? 'Latest, returned. Kept on record.' : 'Current') : 'Superseded. Kept on record.'}</td></tr>`).join('') : '<tr><td colspan="3" class="muted">No calculation has completed.</td></tr>')}</div></div>
    <div class="sec"><h3>Audit history</h3>${timeline(p.history)}</div>`;
}

/* ---------- period Tree and Kanban, shared by the variants ---------- */
function filteredPeriods() {
  if (S.sample === 'empty') return [];
  return D.periods.filter(p => (S.status === 'ALL' || p.status === S.status) && matches(p.id + ' ' + p.name));
}
function periodsTree(list) {
  const rows = list.map(p => `<tr id="row-${p.id}" ${p.id === S.record ? 'aria-current="true"' : ''}>
    <th scope="row">${openLink(p.id, V.openPeriod(p.id), 'open-' + p.id)}<span class="blk cap muted" style="font-weight:400;max-width:260px">${esc(p.name)}</span></th>
    <td>${p.run === 'REGULAR' ? 'Regular' : 'Special'}${p.components ? `<span class="blk cap muted" style="max-width:200px">${esc(p.components.join(', '))}</span>` : ''}</td>

/* ---------- Variant C · Linked registers: each record type is its own register across periods, as Leave keeps its ledger apart ---------- */

    payslips: { label: 'Payslips', perm: 'payslips.read', views: ['tree', 'kanban'], lede: 'The statement of each finalized Employee result. A payslip is Ready before it is Released, and release is separate from payment.' },

const inPf = p => S.pf === 'ALL' || p.id === S.pf;

}

/* ---------- shell ---------- */
const VARIANTS = [['a', 'A', 'Period file'], ['b', 'B', 'Work desk'], ['c', 'C', 'Linked registers']];
function render() {
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  normalize();
  document.title = `${V.dests[S.dest].label} · ${V.letter} ${V.name} · Payroll prototype`;
  document.getElementById('app').innerHTML = shell();
  const want = S.focus || fid;
  S.focus = null;
  const el = want && [...document.querySelectorAll('[data-fid]')].find(x => x.dataset.fid === want);
  if (el) { el.focus({ preventScroll: want !== 'flash' }); if (el.type === 'search') el.setSelectionRange(el.value.length, el.value.length); }
}
function normalize() {
  const allowed = V.nav.filter(d => can(V.dests[d].perm));
  if (!allowed.includes(S.dest)) { if (S.dest) { S.view = 'tree'; S.record = ''; } S.dest = allowed[0] || V.nav[0]; }
  if (!V.dests[S.dest].views.includes(S.view)) S.view = V.dests[S.dest].views[0];
}
function shell() {
  const r = me(), dests = V.nav.filter(d => can(V.dests[d].perm));
  const stages = ['Structure', 'Merit selection', 'Personnel', 'Time & attendance', 'Leave', 'Overtime'];
  return `<div class="shell">
  <aside class="nav" ${S.navOpen ? 'data-open' : ''}>
    <div class="nav-brand"><span class="nav-mark" aria-hidden="true">L</span><span>LingkodHR</span>
      <button type="button" class="nav-toggle" data-act="nav" aria-expanded="${S.navOpen}" aria-controls="primary-navigation" data-fid="nav-toggle">${S.navOpen ? 'Close' : 'Menu'}</button></div>
    <div class="nav-agency"><span>Agency context</span><strong>${AGENCY}</strong></div>
    <nav id="primary-navigation" class="nav-list" aria-label="Primary">
      ${stages.map(s => `<div class="nav-stage">${s}</div>`).join('')}
      <div class="nav-stage on" id="stage-payroll">Payroll</div>
      <ul aria-labelledby="stage-payroll">${dests.map(d => `<li><a class="nav-link" href="${urlFor({ dest: d, view: 'tree', record: '', tab: '', sub: '' })}" data-nav="${d}" data-fid="nav-${d}" ${d === S.dest ? 'aria-current="page"' : ''}>${V.dests[d].label}${V.badge ? V.badge(d) : ''}</a></li>`).join('')}
        ${isEmployee() ? '' : V.inert.map(l => `<li class="nav-inert">${l}</li>`).join('')}</ul>
      <div class="nav-stage">Oversight</div>
      <p class="nav-note">Only Payroll works in this prototype.${isEmployee() ? '' : ' The grey Payroll entries show where the other tickets would sit.'}</p>
    </nav>
    <div class="nav-user"><span class="avatar" aria-hidden="true">${r.person.split(' ').map(w => w[0]).slice(0, 2).join('')}</span><span class="who"><strong>${esc(r.person)}</strong><span>${esc(r.label)}</span></span></div>
  </aside>
  <main id="main">${page()}${controls()}</main>
</div>${switcher()}`;
}
function switcher() {
  return `<nav class="switcher" aria-label="Prototype variants"><span>#327</span>${VARIANTS.map(([k, l, n]) => `<a href="${k}.html?role=${S.role}" title="${l} · ${n}" aria-label="Variant ${l}, ${n}" ${k === V.key ? 'aria-current="page"' : ''}>${l}</a>`).join('')}<a href="compare.html" title="Comparison page">Compare</a></nav>`;
}
function page() {
  const meta = V.dests[S.dest];
  const viewSw = meta.views.length > 1 ? `<div class="viewsw" role="group" aria-label="Record view">${meta.views.map(v => `<button type="button" aria-pressed="${S.view === v}" data-view="${v}" data-fid="view-${v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>` : '';
  const primary = S.dest === 'periods' && can('periods.create') ? `<button type="button" class="btn btn-primary" data-act="period-new" data-fid="period-new">Create Payroll Period</button>` : '';
  const flashMsg = S.flash ? `<div class="msg msg-${S.flash.tone}" role="status" tabindex="-1" data-fid="flash">${esc(S.flash.text)}</div>` : '';
  return `<header class="page-header"><nav aria-label="Breadcrumb"><ol class="crumbs"><li>Payroll</li></ol></nav>
    <div class="title-row"><h1>${meta.label}</h1><div class="row">${viewSw}${primary}</div></div></header>
    <p class="lede">${meta.lede}</p>${flashMsg}${body()}`;
}
function body() {
  const meta = V.dests[S.dest];
  if (S.sample === 'denied' || !can(meta.perm)) return surface(meta.label + ' aren’t available to you.', 'Your role, ' + esc(me().label) + ', doesn’t include reading ' + esc(meta.label) + '. Ask your HR Administrator if you need access.', true);
  if (S.sample === 'loading') return `<div class="surface page" role="status" aria-live="polite"><strong>Loading ${esc(meta.label)}…</strong><p>Records appear when the API answers.</p></div>`;
  return V.body();
}
function controls() {
  const stages = [['DRAFT', 'Draft, returned with exceptions'], ['CALCULATING', 'Calculating'], ['FOR_REVIEW', 'For review'], ['CERTIFIED', 'Certified, no reviews yet'], ['REVIEWED', 'Certified, both reviews confirmed'], ['APPROVED', 'Approved'], ['FINALIZED', 'Finalized, payslips generating'], ['RELEASED', 'Finalized, payslips released, export generated']];
  return `<details class="proto"><summary>Prototype controls</summary><div class="grid">
    <label class="field">Preview role<select class="input" data-role data-fid="role">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${k === S.role ? 'selected' : ''}>${esc(r.label)} · ${esc(r.person)}</option>`).join('')}</select></label>
    <label class="field" style="width:320px">Jump the November payroll to<select class="input" data-jump data-fid="jump">${stages.map(([k, l]) => `<option value="${k}" ${k === D.stage ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="field">Sample state<select class="input" data-samplesel data-fid="sample">${[['live', 'Live sample data'], ['empty', 'Empty'], ['loading', 'Loading'], ['denied', 'Permission denied']].map(([k, l]) => `<option value="${k}" ${k === S.sample ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <button type="button" class="btn btn-secondary" data-act="reset" data-fid="reset">Reset sample data</button></div>
    <p class="cap muted" style="margin-top:8px">Synthetic data for ${AGENCY}. Today is ${dt(TODAY)}. Every name and amount is made up, and no figure here is a payroll rule. Actions persist in this tab, across variants, until reset.</p></details>`;
}

/* ---------- dialogs ---------- */
let ASK = null;
function ask(o) {
  ASK = o;
  const d = document.getElementById('dlg');
  d.innerHTML = `<form class="dlg" method="dialog" data-ask><div class="dlg-head"><h2 id="dlg-title">${esc(o.title)}</h2><p id="dlg-desc" class="small muted">${o.desc || ''}</p></div>
    ${o.fields || o.label ? `<div class="dlg-body">${o.fields || ''}${o.label ? `<label class="field">${esc(o.label)}<textarea class="input" name="reason" required></textarea>${o.hint ? `<span class="hint">${o.hint}</span>` : ''}</label>` : ''}</div>` : ''}
    <div class="dlg-foot"><button type="button" class="btn btn-secondary" data-close>Cancel</button><button type="submit" class="btn ${o.danger ? 'btn-solid-danger' : 'btn-primary'}">${esc(o.confirm)}</button></div></form>`;
  d.showModal();
}
const HANDLERS = {
  nav() { S.navOpen = !S.navOpen; },
  reset() { try { sessionStorage.removeItem(STORE); } catch (e) { /* ignore */ } D = seedData(); flash('Sample data reset.'); },
  print() { window.print(); },
  download(id) { flash(`Prototype: “${id}” would download as the stored file.`, 'info'); },
  'period-new'() {
    const open = D.periods.find(p => p.run === 'REGULAR' && !['FINALIZED', 'VOIDED'].includes(p.status));
    flash(open ? `Refused for a regular period: ${open.id} isn’t finalized, and an Agency has one open regular period at a time. A special period would name the components it pays.` : 'Prototype: creating the next period isn’t part of this round.', open ? 'danger' : 'info');
  },
  'calc-start'(id) { const p = period(id); ask({ title: `Start calculation ${p.v + 1} of ${p.id}?`, desc: `It takes a rule snapshot and uses every input accepted by the cutoff, ${dtt(p.cutoff)}. Until it completes, ${p.id} has no current results.`, confirm: 'Start calculation', onOk: () => ACT.calcStart(p) }); },
  'calc-finish'(id) { ACT.calcFinish(period(id)); },
  'jobs-finish'(id) { ACT.jobsFinish(period(id)); },
  return(id) { ask({ title: 'Return for correction', desc: 'The payroll goes back to Draft so the Payroll Preparer can correct inputs and recalculate.', label: 'Review comment', confirm: 'Return to Draft', danger: true, onOk: r => ACT.returnForCorrection(period(id), r) }); },
  certify(id) { const p = period(id), t = totals(p); ask({ title: `Certify calculation ${p.v} of ${p.id}?`, desc: `You certify the personnel, attendance, and leave inputs of ${count(t.n, 'Employee result')}, net ${peso(t.net)}, hash ${t.hash}. Certifying locks the payroll at this calculation and generates the Certified Payroll Review Export. It does not approve the payroll.`, confirm: 'Certify', onOk: () => ACT.certify(p) }); },
  revoke(id) { ask({ title: 'Revoke certification', desc: 'The payroll returns to For review. Its review export is superseded and both checkpoint reviews are revoked.', label: 'Reason', confirm: 'Revoke certification', danger: true, onOk: r => ACT.revoke(period(id), r) }); },
  'budget-confirm'(id) { const p = period(id); ask({ title: `Confirm the Budget review of ${p.cpre.id}?`, desc: 'You confirm this exact certified snapshot. It asserts no external fund validation or obligation, and it can’t be changed afterwards.', confirm: 'Confirm Budget review', onOk: () => ACT.review(p, 'budget', 'CONFIRMED', '') }); },
  'accounting-confirm'(id) { const p = period(id); ask({ title: `Confirm the Accounting review of ${p.cpre.id}?`, desc: 'You confirm this exact certified snapshot. It asserts no accounting posting, and it can’t be changed afterwards.', confirm: 'Confirm Accounting review', onOk: () => ACT.review(p, 'accounting', 'CONFIRMED', '') }); },
  'budget-return'(id) { ask({ title: 'Return this snapshot', desc: 'The payroll goes back to For review. Certification is revoked, the export is superseded, and the Accounting review is revoked.', label: 'Why it is returned', confirm: 'Return', danger: true, onOk: r => ACT.review(period(id), 'budget', 'RETURNED', r) }); },
  'accounting-return'(id) { ask({ title: 'Return this snapshot', desc: 'The payroll goes back to For review. Certification is revoked, the export is superseded, and the Budget review is revoked.', label: 'Why it is returned', confirm: 'Return', danger: true, onOk: r => ACT.review(period(id), 'accounting', 'RETURNED', r) }); },
  approve(id) { const p = period(id), t = totals(p); ask({ title: `Approve ${p.id}?`, desc: `Calculation ${p.v}, certified by ${esc(p.cert.by)}, with both checkpoint reviews confirmed. Net ${peso(t.net)}. Approving does not finalize: lines stay open to a return, and no payslip or export exists until you finalize.`, confirm: 'Approve payroll', onOk: () => ACT.approve(p) }); },
  'return-approved'(id) { ask({ title: 'Return before finalization', desc: 'The payroll goes back to For review, and its certification and reviews are revoked.', label: 'Reason', confirm: 'Return', danger: true, onOk: r => ACT.returnApproved(period(id), r) }); },
  finalize(id) { const p = period(id), t = totals(p); ask({ title: `Finalize ${p.id}?`, desc: `Finalizing checks the approved hash ${t.hash}, open exceptions, and line totals in one transaction. After it, every line is immutable and a correction is a later linked record. Payslips start generating; none is released.`, confirm: 'Finalize payroll', onOk: () => ACT.finalize(p) }); },
  'slip-release-all'(id) { const p = period(id); ask({ title: `Release ${count(slipCounts(p).READY, 'Ready payslip')}?`, desc: 'Each Employee can read their own payslip once it is released. Release doesn’t wait on Disbursement Outcomes and says nothing about payment.', confirm: 'Release payslips', onOk: () => ACT.releaseAll(p) }); },
  'slip-withhold'(id) { const [pid, emp] = id.split('|'); ask({ title: `Withhold ${EMP[emp].name}’s payslip`, desc: 'The Employee can’t read it until it is released. Withholding never stops payment.', label: 'Authorized reason', confirm: 'Withhold payslip', danger: true, onOk: r => ACT.withhold(period(pid), emp, r) }); },
  'slip-release'(id) { const [pid, emp] = id.split('|'); ACT.releaseOne(period(pid), emp); },
  'dest-fix'(id) { ACT.destFix(period(id)); },
  'export-generate'(id) { ACT.exportGenerate(period(id)); },
  outcome(id) {
    const [pid, iid] = id.split('|'), p = period(pid), i = p.export.instructions.find(x => x.id === iid), l = latest(i);
    const next = { NONE: ['SUBMITTED'], SUBMITTED: ['ACCEPTED', 'REJECTED'], ACCEPTED: ['SETTLED', 'REJECTED'] }[l] || [];
    ask({
      title: `Record a Disbursement Outcome for ${i.id}`, desc: `${esc(EMP[i.emp].name)} · ${peso(result(p, i.emp).net)} · latest: ${OUTCOME[l][0]}. Outcomes are evidence from outside LingkodHR and are only ever added.`,
      fields: `<label class="field">Outcome<select class="input" name="status">${next.map(s => `<option value="${s}">${OUTCOME[s][0]}</option>`).join('')}</select></label><label class="field">Evidence reference<input class="input" name="ref" required placeholder="Batch, acknowledgment, or advice number"></label><label class="field">Note<input class="input" name="note"></label>`,
      confirm: 'Record outcome', onOk: (r, f) => ACT.outcome(p, iid, f.get('status'), f.get('ref'), f.get('note')),
    });
  },
  supersede(id) { const [pid, iid] = id.split('|'); ask({ title: `Supersede ${iid}?`, desc: 'A new Payment Instruction replaces the rejected one. The rejected instruction and its outcomes stay on record.', confirm: 'Supersede instruction', onOk: () => ACT.supersede(period(pid), iid) }); },
  'output-generate'(id) { const [pid, k] = id.split('|'); ACT.outputGenerate(period(pid), k); },
  'exc-ack'(id) { const x = D.exceptions.find(e => e.id === id); ask({ title: `Acknowledge ${x.id}`, desc: esc(x.detail), label: 'Reason', hint: 'A warning is acknowledged with a reason. A blocking exception can’t be acknowledged or waived.', confirm: 'Acknowledge warning', onOk: r => ACT.ack(x, r) }); },
  'hold-place'(id) { const x = D.exceptions.find(e => e.id === id); ask({ title: `Place a Payroll Hold on ${EMP[x.emp].name}`, desc: `${esc(EMP[x.emp].name)} gets no result in ${x.period}, so the rest of the Agency can be paid. The held month is paid later as a Payroll Adjustment.`, label: 'Reason', confirm: 'Place Payroll Hold', onOk: r => ACT.hold(x, r) }); },
  'hold-lift'(id) { ACT.liftHold(D.exceptions.find(e => e.id === id)); },
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-close],[data-go],[data-act],[data-tab],[data-view],[data-nav],[data-month]');
  if (!t) return;
  if (t.dataset.close !== undefined) return document.getElementById('dlg').close();
  if (t.dataset.go) return go(JSON.parse(t.dataset.go));
  if (t.dataset.nav) { e.preventDefault(); S.navOpen = false; return go({ dest: t.dataset.nav, view: 'tree', record: '' }); }
  if (t.dataset.tab) return go({ tab: t.dataset.tab }, true);
  if (t.dataset.month) return go({ record: t.dataset.month }, true);
  if (t.dataset.view) return go({ view: t.dataset.view, tab: S.tab });
  S.flash = null;
  HANDLERS[t.dataset.act](t.dataset.id);
  save(); render();
});
document.addEventListener('submit', e => {
  if (!e.target.matches('[data-ask]')) return;
  e.preventDefault();
  const f = new FormData(e.target), o = ASK;
  document.getElementById('dlg').close();
  S.flash = null;
  o.onOk((f.get('reason') || '').trim(), f);
  save(); render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.filter && t.type === 'search') { S[t.dataset.filter] = t.value; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter && t.type !== 'search') { S[t.dataset.filter] = t.value; render(); }
  else if (t.dataset.role !== undefined) { S.role = t.value; S.flash = null; go({ dest: '', view: 'tree', record: '' }); }
  else if (t.dataset.jump !== undefined) { jumpTo(t.value); flash(`Prototype: the November payroll is now at “${t.selectedOptions[0].textContent}”.`, 'info'); render(); }
  else if (t.dataset.samplesel !== undefined) { S.sample = t.value; go({}, true); }
});
document.addEventListener('keydown', e => {
  if (!e.target.matches('[role=tab]') || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const all = [...e.target.parentElement.children], n = all[(all.indexOf(e.target) + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length];
  S.focus = n.dataset.fid; go({ tab: n.dataset.tab }, true);
});
window.addEventListener('popstate', () => { readUrl(); render(); });

(function init() {
  load();
  const q = readUrl();
  if (q.has('stage')) { jumpTo(q.get('stage')); }
  S._lastDest = S.dest;
  render();
})();

</script>
</body>
</html>
