/* Enterprise workbench tokens, copied from apps/web/src/app/globals.css. */
:root{--nav:#0f2240;--nav-ink:#e8eef7;--nav-muted:#93a3bd;--nav-focus:#6fa3ec;--canvas:#f2f4f7;--surface:#fff;--border:#d4d9e1;--border-subtle:#e6e9ee;--ink:#121a26;--ink-muted:#566175;--primary:#1a4fa0;--primary-hover:#153f80;--focus:#1a4fa0;--success:#1e6b3a;--warning:#9a6200;--danger:#a4262c;--neutral:#566175;--info:#1a4fa0;--gutter:24px}
*{box-sizing:border-box}
html{min-width:320px;color-scheme:light;font-family:'Noto Sans Variable','Noto Sans',sans-serif;background:var(--canvas);color:var(--ink)}
body{margin:0;min-height:100vh;font-size:.875rem;line-height:1.5}
button,input,select,textarea{font:inherit}
table{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
::selection{background:var(--primary);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-muted)}.cap{font-size:.75rem;line-height:1.4}.small{font-size:.8125rem}
.t-success{color:var(--success)}.t-warning{color:var(--warning)}.t-danger{color:var(--danger)}.t-muted{color:var(--ink-muted)}
.blk{display:block}.num{text-align:right;white-space:nowrap}.nowrap{white-space:nowrap}
p{margin:0}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.nav{background:var(--nav);color:var(--nav-ink);--focus:var(--nav-focus);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid rgb(255 255 255/10%)}
.nav-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgb(255 255 255/10%);font-weight:650;font-size:.875rem}
.nav-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:2px;background:var(--nav-focus);color:var(--nav);font-size:12px;font-weight:700}
.nav-toggle{display:none;margin-left:auto;cursor:pointer;border:1px solid rgb(255 255 255/20%);background:transparent;color:var(--nav-ink);border-radius:2px;padding:6px 12px;font-size:.8125rem;font-weight:600}
.nav-agency{padding:12px 16px;border-bottom:1px solid rgb(255 255 255/10%)}
.nav-agency span{display:block;font-size:.75rem;color:var(--nav-muted)}
.nav-agency strong{display:block;font-size:.8125rem;font-weight:600}
.nav-list{padding:8px;flex:1}
.nav-stage{padding:6px 8px;font-size:.8125rem;font-weight:600;color:var(--nav-muted);margin-top:2px}
.nav-stage.on{color:var(--nav-ink)}
.nav-list ul{list-style:none;margin:0 0 6px;padding:0}
.nav-link{display:block;padding:6px 8px 6px 20px;border-radius:2px;font-size:.8125rem;color:var(--nav-ink);text-decoration:none}
.nav-link:hover{background:rgb(255 255 255/6%)}
.nav-link[aria-current=page]{background:rgb(255 255 255/10%);font-weight:600;box-shadow:inset 0 0 0 1px rgb(255 255 255/14%)}
.nav-note{padding:8px 8px 0;font-size:.75rem;color:var(--nav-muted)}
.nav-user{border-top:1px solid rgb(255 255 255/10%);padding:12px 16px;display:flex;gap:10px;align-items:center}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:var(--nav-focus);color:var(--nav);display:grid;place-items:center;font-size:11px;font-weight:700}
.who strong{display:block;font-size:.8125rem;font-weight:600}.who span{display:block;font-size:.75rem;color:var(--nav-muted)}
@media (max-width:979px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;height:auto;border-right:0}
  .nav-toggle{display:inline-flex}
  .nav .nav-list,.nav .nav-agency,.nav .nav-user{display:none}
  .nav[data-open] .nav-list,.nav[data-open] .nav-agency,.nav[data-open] .nav-user{display:block}
  .nav[data-open] .nav-user{display:flex}
}
main{min-width:0;padding:24px var(--gutter) 112px;display:grid;gap:20px;align-content:start}
@media (max-width:620px){:root{--gutter:16px}}
.page-header{margin:-24px calc(var(--gutter)*-1) 0;background:var(--surface);border-bottom:1px solid var(--border);padding:20px var(--gutter) 0;min-width:0}
.crumbs{display:flex;gap:6px;list-style:none;margin:0;padding:0;font-size:.75rem;color:var(--ink-muted)}
.title-row{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 24px;padding:4px 0 20px}
h1{margin:0;font-size:1.375rem;line-height:1.2;font-weight:650;letter-spacing:-.01em}
h2,h3,h4{margin:0;font-size:.875rem;line-height:1.4;font-weight:650}
.lede{max-width:780px;font-size:.8125rem;color:var(--ink-muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.viewsw{display:flex;gap:2px;border:1px solid var(--border);background:var(--surface);padding:2px;border-radius:2px}
.viewsw button{cursor:pointer;border:0;background:transparent;border-radius:2px;padding:6px 12px;font-size:.75rem;font-weight:650;color:var(--ink-muted)}
.viewsw button:hover{color:var(--ink)}
.viewsw button[aria-pressed=true]{background:var(--canvas);color:var(--ink)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border:1px solid transparent;border-radius:2px;font-size:.8125rem;font-weight:600;white-space:nowrap;cursor:pointer;text-decoration:none;background:transparent;color:var(--ink-muted)}
.btn:hover{background:var(--canvas);color:var(--ink)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-secondary{background:var(--surface);border-color:var(--primary);color:var(--primary)}
.btn-secondary:hover{background:var(--canvas);color:var(--primary)}
.btn-danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:#fbf1f1;color:var(--danger)}
.btn-solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-solid-danger:hover{background:#8a1f24;color:#fff}
.btn-sm{min-height:30px;padding:0 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{cursor:pointer;border:0;background:transparent;padding:0;color:var(--primary);font-weight:600;text-align:left;font-size:inherit;line-height:inherit}
.linkbtn:hover{text-decoration:underline;text-underline-offset:2px}
.field{display:grid;gap:4px;font-size:.75rem;font-weight:650;color:var(--ink);min-width:0}
.input{min-height:36px;width:100%;border-radius:2px;border:1px solid var(--border);background:var(--surface);padding:0 10px;font-size:.875rem;font-weight:400;color:var(--ink);outline:none}
textarea.input{padding:8px 10px;min-height:72px;resize:vertical}
.input:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.input[aria-invalid=true]{border-color:var(--danger)}
.hint{font-size:.75rem;font-weight:400;color:var(--ink-muted)}
.err{font-size:.75rem;font-weight:400;color:var(--danger)}

/* Panel, table, tag */
.panel{min-width:0;border:1px solid var(--border);border-radius:2px;background:var(--surface)}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;min-height:44px;padding:8px 16px;border-bottom:1px solid var(--border)}
.panel-body{padding:16px}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.filters .field{width:220px;max-width:100%}
.scroll{overflow-x:auto;position:relative}
.tbl{width:100%;border-collapse:collapse;font-size:.8125rem}
.tbl th[scope=col]{border-bottom:1px solid var(--border);background:var(--canvas);padding:8px 16px;text-align:left;font-size:.75rem;font-weight:650;color:var(--ink);white-space:nowrap}
.tbl th[scope=col].num,.tbl td.num{text-align:right}
.tbl td,.tbl th[scope=row]{border-bottom:1px solid var(--border-subtle);padding:10px 16px;vertical-align:top;text-align:left}
.tbl th[scope=row]{font-weight:600}
.tbl tbody tr:hover{background:var(--canvas)}
.tbl tr[aria-current=true]{background:rgb(26 79 160/8%);box-shadow:inset 3px 0 0 var(--primary)}
.tbl tr.grp:hover{background:var(--canvas)}
.tbl tr.grp th{background:var(--canvas);border-bottom:1px solid var(--border);border-top:1px solid var(--border);padding:8px 16px;text-align:left;font-weight:650}
.tbl tr.flash td,.tbl tr.flash th{background:rgb(154 98 0/9%)}
.tag{display:inline-block;border:1px solid;border-radius:2px;padding:0 6px;font-size:.75rem;font-weight:600;white-space:nowrap;line-height:1.5}
.tag-success{border-color:var(--success);color:var(--success)}.tag-warning{border-color:var(--warning);color:var(--warning)}.tag-danger{border-color:var(--danger);color:var(--danger)}.tag-neutral{border-color:var(--neutral);color:var(--neutral)}.tag-info{border-color:var(--info);color:var(--info)}
.stack{display:grid;justify-items:start;gap:4px}
.surface{display:grid;justify-items:center;gap:6px;padding:40px 16px;text-align:center;color:var(--ink-muted);font-size:.8125rem}
.surface strong{color:var(--ink);font-size:.875rem;font-weight:650}
.surface.page{border:1px solid var(--border);background:var(--surface);border-radius:2px}
.msg{border-radius:2px;border:1px solid;padding:10px 12px;font-size:.8125rem}
.msg-success{border-color:rgb(30 107 58/40%);background:rgb(30 107 58/5%);color:var(--success)}
.msg-warning{border-color:rgb(154 98 0/45%);background:rgb(154 98 0/6%);color:#7a4e00}
.msg-danger{border-color:rgb(164 38 44/40%);background:rgb(164 38 44/5%);color:var(--danger)}
.msg-info{border-color:var(--border);background:var(--canvas);color:var(--ink-muted)}

/* Kanban */
.board{display:flex;gap:12px;overflow-x:auto;padding:16px}
.col{display:grid;align-content:start;gap:8px;min-width:230px;flex:1;border:1px solid var(--border);border-radius:2px;background:var(--canvas);padding:12px}
.col h3{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.75rem}
.card{display:grid;gap:4px;text-align:left;cursor:pointer;border:1px solid var(--border);border-radius:2px;background:var(--surface);padding:10px 12px;font-size:.8125rem;color:var(--ink)}
.card:hover{border-color:var(--primary)}
.card[aria-current=true]{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}
.card .k{font-size:.75rem;font-weight:650;color:var(--primary)}

/* Form record */
.rec{display:grid;gap:20px;padding:16px}
.rec-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px 24px}
.rec-title{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.rec-title h2{font-size:1.125rem;line-height:1.3}
.facts{display:flex;flex-wrap:wrap;gap:8px 40px;margin:14px 0 0}
.facts dt{font-size:.75rem;color:var(--ink-muted)}
.facts dd{margin:0;font-size:.875rem;font-weight:600}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);margin:0 -16px;padding:0 16px}
.tab{cursor:pointer;border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 16px;font-size:.8125rem;white-space:nowrap;color:var(--ink-muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{border-bottom-color:var(--primary);font-weight:650;color:var(--ink)}
.tab:focus-visible{outline-offset:-3px}
.sec{display:grid;gap:12px}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.dl{display:grid;gap:10px 24px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin:0}
.dl dt{font-size:.75rem;color:var(--ink-muted)}.dl dd{margin:0;font-size:.875rem}
.box{border:1px solid var(--border);border-radius:2px;background:var(--canvas);padding:12px 14px;display:grid;gap:6px;font-size:.8125rem}
.inset{border:1px solid var(--border);border-radius:2px;overflow:hidden}
.inset .tbl th[scope=col]{background:var(--canvas)}
.pager{display:flex;align-items:center;gap:6px}

/* Hour values: one cell per value, labelled with its source. */
.hours{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0}
.hour{border:1px solid var(--border);border-radius:2px;background:var(--canvas);padding:8px 12px;display:grid;gap:2px;align-content:start}
.hour dt{font-size:.75rem;font-weight:650;color:var(--ink)}
.hour dd{margin:0}
.hour .v{font-size:1rem;font-weight:650;font-variant-numeric:tabular-nums}
.hour .src{font-size:.75rem;color:var(--ink-muted)}
.hour.unknown .v{color:var(--ink-muted)}
.hour.pending{border-style:dashed;background:var(--surface)}
.hourkey summary{cursor:pointer;font-size:.8125rem;font-weight:600;color:var(--primary);width:max-content}
.hourkey dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 24px;margin:10px 0 0;font-size:.8125rem}
.hourkey dt{font-weight:650}.hourkey dd{margin:0;color:var(--ink-muted)}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.timeline li{display:grid;gap:2px;font-size:.8125rem;border-left:2px solid var(--border);padding-left:12px}

/* Prototype controls sit outside the design. */
.proto{border:1px dashed #8a94a6;border-radius:2px;background:#fafbfc;padding:10px 14px;font-size:.8125rem}
.proto summary{cursor:pointer;font-weight:650}
.proto .grid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:10px}
.proto .field{width:220px}

/* Dialog */
dialog{border:1px solid var(--border);border-radius:2px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);color:var(--ink);box-shadow:0 18px 48px rgb(15 34 64/22%)}
dialog::backdrop{background:rgb(15 34 64/40%)}
.dlg{display:grid;max-height:calc(100vh - 50px)}
.dlg-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:grid;gap:4px}
.dlg-head h2{font-size:1rem}
.dlg-body{padding:16px 20px;display:grid;gap:14px;overflow-y:auto}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border);background:var(--canvas)}
.opts{display:grid;gap:8px;border:0;margin:0;padding:0}
.opts legend{font-size:.75rem;font-weight:650;margin-bottom:4px;padding:0}
.opt{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;font-size:.8125rem;font-weight:400;border:1px solid var(--border);border-radius:2px;padding:8px 10px}
.opt input{margin:3px 0 0}
.opt .hint{grid-column:2}
.opt.off{background:var(--canvas)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

function load() { try { const v = JSON.parse(sessionStorage.getItem(STORE)); if (v && v.seq) return v; } catch (e) { /* fall back to seed */ } return seed(); }
function save() { try { sessionStorage.setItem(STORE, JSON.stringify(D)); } catch (e) { /* private mode */ } }
const S = { navOpen: false, q: '', status: 'ALL', authFilter: 'ALL', asOf: TODAY, flash: null, focus: null, hl: null };
function readUrl() {
  const p = new URLSearchParams(location.search);
  S.role = ROLES[p.get('role')] ? p.get('role') : 'supervisor';
  S.dest = p.get('dest') || '';
  S.view = p.get('view') || 'tree';
  S.record = p.get('record') || '';
  S.tab = p.get('tab') || '';
  S.sample = p.get('sample') || 'live';
}
function urlFor(o) {
  const m = Object.assign({ role: S.role, dest: S.dest, view: S.view, record: S.record, tab: S.tab, sample: S.sample }, o || {});
  const p = new URLSearchParams();
  for (const k of ['role', 'dest', 'view', 'record', 'tab', 'sample']) if (m[k] && !(k === 'sample' && m[k] === 'live')) p.set(k, m[k]);
  return '?' + p.toString();
}
function go(o, keepFilters) {
  if (o.dest && o.dest !== S.dest && !keepFilters) { S.q = ''; S.status = 'ALL'; S.authFilter = 'ALL'; }
  if (('record' in o || 'dest' in o) && !('tab' in o)) o.tab = '';
  S.hl = o.hl || null;
  S.scrollHl = !!o.hl;
  Object.assign(S, o);
  S.flash = o.flash || null;
  history.pushState(null, '', urlFor());
  render();
  if (!o.noScroll) window.scrollTo(0, 0);
}
const can = p => ROLES[S.role].can.includes(p);

/* ---------- formatting ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const parts = iso => iso.slice(0, 10).split('-').map(Number);
const weekday = iso => { const [y, m, d] = parts(iso); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const dt = iso => { if (!iso) return '—'; const [y, m, d] = parts(iso); return d + ' ' + MON[m - 1] + ' ' + y; };
const dtw = iso => WD[weekday(iso)] + ' ' + dt(iso);
const dshort = iso => { const [, m, d] = parts(iso); return d + ' ' + MON[m - 1]; };
const range = (a, b) => (a.slice(0, 7) === b.slice(0, 7) ? parts(a)[2] + '–' + dt(b) : dshort(a) + ' – ' + dt(b));
const hrs = n => (n == null ? '—' : (Number.isInteger(n * 2) ? n.toFixed(1) : n.toFixed(2)) + ' h');
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + hrs(Math.abs(n));
const addDays = (iso, n) => { const [y, m, d] = parts(iso); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const tag = ([label, tone]) => `<span class="tag tag-${tone}">${esc(label)}</span>`;
const count = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const sum = (xs, f) => xs.reduce((t, x) => t + (f(x) || 0), 0);
const plural = (n, w) => count(n, w, w + 's');

/* ---------- domain reads (the API owns these in production) ---------- */
const auth = id => D.authorities.find(a => a.id === id);
const svc = id => D.services.find(s => s.id === id);
const cto = id => D.ctos.find(c => c.id === id);
const acctOf = emp => D.accounts.find(a => a.emp === emp && a.status === 'ACTIVE');
const acct = id => D.accounts.find(a => a.id === id);
const entry = id => D.entries.find(e => e.id === id);
function dayType(date) {
  const w = weekday(date);
  return w === 0 || w === 6 ? { label: 'Rest day', ratio: 1.5, rule: 'CSC-DBM JC 2, s. 2004, item 5.4.2' } : { label: 'Workday', ratio: 1, rule: 'CSC-DBM JC 2, s. 2004, item 5.4.1' };
}
function attendance(emp, date) { return date > LOCKED_THROUGH ? { locked: false } : { locked: true, hours: ATT[emp + '|' + date] || 0 }; }
const notLockedReason = date => `Attendance for ${dtw(date)} isn't locked yet (period 16–31 Oct 2026 is open), so actual hours are unknown.`;
function certifiedOn(a, emp, exceptId) { return sum(D.services.filter(s => s.auth === a.id && s.emp === emp && s.id !== exceptId && s.certified != null && s.status !== 'NOT_CERTIFIED'), s => s.certified); }
function lineOf(a, emp) { return a.lines.find(l => l.emp === emp); }
function remaining(a, emp, exceptId) { const l = lineOf(a, emp); return l && l.authorized != null ? l.authorized - certifiedOn(a, emp, exceptId) : null; }
function creditedOf(s) { return s.status === 'COMPENSATED' && s.decision && s.decision.method === 'COC' ? s.decision.credited : null; }
function entriesOf(acctId, asOf) { return D.entries.filter(e => e.acct === acctId && (!asOf || e.eff <= asOf)).sort((x, y) => (x.eff + x.posted).localeCompare(y.eff + y.posted)); }
function balance(acctId, asOf) { return sum(entriesOf(acctId, asOf), e => e.qty); }
function committed(emp) { return sum(D.ctos.filter(c => c.emp === emp && c.status === 'APPROVED'), c => c.approved); }
function available(emp) { const a = acctOf(emp); return a ? balance(a.id) - committed(emp) : null; }
function monthCredits(emp, iso) { const a = acctOf(emp); return a ? sum(D.entries.filter(e => e.acct === a.id && e.type === 'EARNED' && e.eff.slice(0, 7) === iso.slice(0, 7)), e => e.qty) : 0; }
// Expiring credit assumes uses draw the earliest-expiring credit first (D8, still open in #318).
function expiringBy(acctId, until) {
  const lots = entriesOf(acctId).filter(e => e.qty > 0 && e.expires && e.type !== 'REVERSAL').map(e => ({ id: e.id, left: e.qty, expires: e.expires }));
  for (const e of entriesOf(acctId).filter(x => x.qty < 0)) {
    let need = -e.qty;
    const target = e.reverses || e.expiresEntry;
    const pool = target ? lots.filter(l => l.id === target) : lots.slice().sort((x, y) => x.expires.localeCompare(y.expires));
    for (const l of pool) { const take = Math.min(l.left, need); l.left -= take; need -= take; if (!need) break; }
  }
  return sum(lots.filter(l => l.expires <= until), l => l.left);
}
const reversalOf = id => D.entries.find(e => e.reverses === id);

function visibleAuthorities() {
  if (isEmployee()) return D.authorities.filter(a => a.lines.some(l => l.emp === SELF) && ['APPROVED', 'ACTIVE', 'COMPLETED'].includes(a.status));
  return D.authorities;
}
function visibleServices() { return D.services.filter(s => !isEmployee() || s.emp === SELF); }
function visibleAccounts() { return D.accounts.filter(a => !isEmployee() || a.emp === SELF); }
function visibleCtos() { return D.ctos.filter(c => !isEmployee() || c.emp === SELF); }

function authPending(a) {
  switch (a.status) {
    case 'DRAFT': return 'Supervisor · submit';
    case 'SUBMITTED': return 'HR or Budget · review';
    case 'FOR_REVIEW': return 'Approving Official · decide';
    case 'APPROVED': return 'Becomes Active on ' + dt(a.from);
    case 'ACTIVE': return 'Employees · record service';
    case 'COMPLETED': {
      const s = D.services.filter(x => x.auth === a.id);
      if (s.some(x => x.status === 'FOR_CERTIFICATION')) return 'Supervisor · certify';
      if (s.some(x => x.status === 'CERTIFIED')) return 'HR or Budget · decide compensation';
      if (s.some(x => x.status === 'FOR_COMPENSATION')) return 'HR · post compensation';
      return '—';
    }
    default: return '—';
  }
}
function svcPending(s) {
  return { PENDING: 'Employee · record', RENDERED: 'Employee · submit', FOR_CERTIFICATION: 'Supervisor · certify', CERTIFIED: 'HR or Budget · decide', FOR_COMPENSATION: 'HR or Leave Administrator · post' }[s.status] || '—';
}
function ctoPending(c) {
  if (c.status === 'POSTED' && c.cancellation) return c.cancellation.state === 'BLOCKED' ? 'Attendance · blocked' : 'Attendance · authorize';
  return { DRAFT: 'Employee · submit', SUBMITTED: 'Supervisor · recommend', FOR_APPROVAL: 'Approving Official · decide', APPROVED: 'Leave Administrator · post on ' + dt(c.date) }[c.status] || '—';
}
function svcEffect(s) {
  if (s.status === 'NOT_CERTIFIED') return ['None — not certified', 'muted'];
  if (s.status === 'COMPENSATED') return s.decision.method === 'COC' ? ['Posted · EARNED ' + signed(s.decision.credited), 'success'] : ['None — non-compensable', 'muted'];
  if (s.status === 'FOR_COMPENSATION') return s.decision.method === 'COC' ? ['Decided ' + signed(s.decision.credited) + ' — not posted', 'warning'] : ['None — non-compensable', 'muted'];
  return ['None — no decision', 'muted'];
}
function ctoEffect(c) {
  if (c.status === 'APPROVED') return ['Committed ' + hrs(c.approved) + ' — not deducted until posted', 'warning'];
  if (c.status === 'POSTED') return ['Posted · USED ' + signed(-c.approved), 'success'];
  if (c.status === 'CANCELLED' && c.reversal) return ['Restored ' + signed(c.approved) + ' by ' + c.reversal, 'muted'];
  if (c.status === 'CANCELLED' && c.wasApproved) return ['Commitment released', 'muted'];
  return ['None — not approved', 'muted'];
}
function ctoAttendance(c) {
  if (c.status === 'POSTED' && c.cancellation) {
    return c.cancellation.state === 'BLOCKED'
      ? ['Cancellation blocked: ' + c.cancellation.reason, 'danger']
      : ['Cancellation awaiting Attendance authorization (' + c.cancellation.ref + ')', 'warning'];
  }
  if (c.status === 'POSTED') return ['CTO on the Attendance Day of ' + dt(c.date), 'muted'];
  if (c.status === 'CANCELLED' && c.voided) return ['CTO input voided on ' + dt(c.date), 'muted'];
  return ['—', 'muted'];
}

  'auth-submit'(id) { const a = auth(id); openDialog({ title: 'Submit ' + id + ' for review', desc: 'HR and Budget review eligibility, necessity, and funding. You can’t edit the authority after submitting.', submit: 'Submit', busy: 'Submitting…', run() { a.status = 'SUBMITTED'; log(a, 'Submitted'); return { message: id + ' submitted for review.' }; } }); },
  'auth-review'(id) { const a = auth(id); openDialog({ title: 'Record review for ' + id, desc: 'Record the eligibility, necessity, and funding result. The Approving Official decides next.', submit: 'Record review', busy: 'Recording…', fields: [{ name: 'note', label: 'Review result', type: 'textarea', required: true, value: S.role === 'budget' ? 'No cash funding needed for COC.' : 'Eligibility and necessity checked.' }],
    run(v) { a.status = 'FOR_REVIEW'; a.reviews.push({ who: me().who, role: me().role, at: TODAY, note: v.note }); log(a, 'Recorded review', v.note); return { message: 'Review recorded. ' + id + ' is with the Approving Official.' }; } }); },
  'auth-approve'(id) {
    const a = auth(id);
    openDialog({ title: 'Approve ' + id, desc: 'Set authorized hours for each Employee. Approval snapshots eligibility, and the authority can’t be edited afterwards.', submit: 'Approve', busy: 'Approving…',
      fields: a.lines.map(l => ({ name: 'h_' + l.emp, label: EMP[l.emp].name + ' · authorized hours', type: 'number', step: '0.5', min: 0.5, value: l.requested, required: true, hint: 'Requested ' + hrs(l.requested) })),
      run(v) {
        if (a.from <= TODAY) return { refused: 'Service dates have started. Overtime needs authority approved before ' + dt(a.from) + '.' };
        a.lines.forEach(l => { l.authorized = Number(v['h_' + l.emp]); l.snapshot = TODAY; });
        a.status = 'APPROVED'; a.approvedBy = me().who; a.approvedAt = TODAY; log(a, 'Approved');
        return { message: id + ' approved. It becomes Active on ' + dt(a.from) + '.' };
      } });
  },
  'auth-reject'(id) { const a = auth(id); openDialog({ title: 'Reject ' + id, desc: 'The requester sees your reason.', submit: 'Reject', danger: true, busy: 'Rejecting…', fields: [{ name: 'reason', label: 'Reason', type: 'textarea', required: true }], run(v) { a.status = 'REJECTED'; a.rejectReason = v.reason; log(a, 'Rejected', v.reason); return { message: id + ' rejected.' }; } }); },
  'auth-cancel'(id) {
    const a = auth(id);
    openDialog({ title: 'Cancel ' + id, desc: a.status === 'DRAFT' ? 'The draft closes and can’t be submitted.' : 'An approved authority can be cancelled only before any service is recorded.', submit: 'Cancel authority', danger: true, busy: 'Cancelling…', fields: [{ name: 'reason', label: 'Reason', type: 'textarea', required: true }],
      run(v) { if (D.services.some(s => s.auth === id && s.status !== 'PENDING')) return { refused: 'Service is already recorded under ' + id + '.' }; a.status = 'CANCELLED'; a.cancelReason = v.reason; log(a, 'Cancelled', v.reason); return { message: id + ' cancelled.' }; } });
  },
  'auth-complete'(id) { const a = auth(id); openDialog({ title: 'Complete ' + id, desc: 'Completing closes service recording and starts certification of what was rendered.', submit: 'Complete', busy: 'Completing…', run() { if (a.to >= TODAY) return { refused: 'The service period runs until ' + dt(a.to) + '.' }; a.status = 'COMPLETED'; log(a, 'Completed the authority'); return { message: id + ' completed.' }; } }); },
  'svc-record'(id) {
    const s = svc(id);
    openDialog({ title: 'Record service · ' + svcLabel(s), desc: 'Record the hours worked and what was done. Actual hours come from Attendance, not from this form.', submit: 'Record service', busy: 'Recording…',
      fields: [{ name: 'claimed', label: 'Claimed hours', type: 'number', step: '0.25', min: 0.25, required: true }, { name: 'acc', label: 'Accomplishment', type: 'textarea', required: true }],
      run(v) { s.claimed = Number(v.claimed); s.accomplishment = v.acc; s.status = 'RENDERED'; log(s, 'Recorded ' + hrs(s.claimed)); return { message: 'Recorded ' + hrs(s.claimed) + ' for ' + svcLabel(s) + '.', hl: s.id }; } });
  },
  'svc-add'(key) {
    const [aid, emp] = key.split('|'); const a = auth(aid);
    const taken = D.services.filter(s => s.auth === aid && s.emp === emp).map(s => s.date);
    const dates = []; for (let d = a.from; d <= a.to && d <= TODAY; d = addDays(d, 1)) if (!taken.includes(d)) dates.push(d);
    openDialog({ title: 'Record another date · ' + EMP[emp].name, desc: 'One record per Employee and date, inside ' + aid + '’s service dates.', submit: 'Record service', busy: 'Recording…',
      fields: [{ name: 'date', label: 'Service date', type: 'select', value: dates[0], options: dates.map(d => ({ value: d, label: dtw(d) + ' · ' + dayType(d).label })) }, { name: 'claimed', label: 'Claimed hours', type: 'number', step: '0.25', min: 0.25, required: true }, { name: 'acc', label: 'Accomplishment', type: 'textarea', required: true }],
      run(v) {
        if (D.services.some(s => s.auth === aid && s.emp === emp && s.date === v.date)) return { refused: 'A service record already exists for this date.' };
        const s = { id: 'S-0' + (500 + D.seq), auth: aid, emp, date: v.date, claimed: Number(v.claimed), certified: null, status: 'RENDERED', accomplishment: v.acc, history: [] };
        log(s, 'Recorded ' + hrs(s.claimed)); D.services.push(s);
        return { message: 'Recorded ' + hrs(s.claimed) + ' for ' + svcLabel(s) + '.', hl: s.id };
      } });
  },
  'svc-submit'(id) { const s = svc(id); openDialog({ title: 'Submit for certification', desc: svcLabel(s) + ' goes to the Supervisor with the locked Attendance hours beside the claim.', submit: 'Submit', busy: 'Submitting…', run() { if (!attendance(s.emp, s.date).locked) return { refused: notLockedReason(s.date) }; s.status = 'FOR_CERTIFICATION'; log(s, 'Submitted for certification'); return { message: svcLabel(s) + ' submitted for certification.', hl: s.id }; } }); },
  'svc-certify'(id) {
    const s = svc(id), a = auth(s.auth), att = attendance(s.emp, s.date), left = remaining(a, s.emp, s.id);
    const def = Math.min(s.claimed, att.hours, left);
    openDialog({ title: 'Certify · ' + svcLabel(s), desc: 'Certified hours can’t exceed actual or remaining authorized hours.', submit: 'Certify', busy: 'Certifying…',
      fields: [{ type: 'info', html: `<dl class="hours" style="grid-template-columns:repeat(3,minmax(0,1fr))">${hourCell('Claimed', hrs(s.claimed), 'Employee')}${hourCell('Actual', hrs(att.hours), 'Locked Attendance')}${hourCell('Authorized left', hrs(left), a.id)}</dl><span class="muted">Accomplishment: ${esc(s.accomplishment)}</span>` },
        { name: 'certified', label: 'Certified hours', type: 'number', step: '0.25', min: 0.25, value: def, required: true }],
      run(v) {
        const n = Number(v.certified);
        if (n > att.hours) return { refused: 'Certified hours can’t exceed the ' + hrs(att.hours) + ' actual hours in locked Attendance.' };
        if (n > left) return { refused: 'Only ' + hrs(left) + ' of ' + EMP[s.emp].name + '’s authorized hours remain on ' + a.id + '.' };
        s.certified = n; s.status = 'CERTIFIED'; s.certifiedBy = me().who; s.certifiedAt = TODAY; log(s, 'Certified ' + hrs(n));
        return { message: 'Certified ' + hrs(n) + ' for ' + svcLabel(s) + '.', hl: s.id };
      } });
  },
  'svc-decline'(id) { const s = svc(id); openDialog({ title: 'Decline certification · ' + svcLabel(s), desc: 'Declined service is never compensated. The Employee sees your reason.', submit: 'Decline', danger: true, busy: 'Declining…', fields: [{ name: 'reason', label: 'Reason', type: 'textarea', required: true }], run(v) { s.status = 'NOT_CERTIFIED'; s.declineReason = v.reason; log(s, 'Declined certification', v.reason); return { message: 'Declined ' + svcLabel(s) + '.', hl: s.id }; } }); },
  'comp-decide'(id) {
    const s = svc(id), dtp = dayType(s.date), a = acctOf(s.emp);
    const prior = s.decision;
    openDialog({ title: (prior ? 'Change decision · ' : 'Decide compensation · ') + svcLabel(s), desc: prior ? 'The new decision supersedes the current one; both stay in the record. Posted decisions can’t change.' : 'Deciding doesn’t credit COC. Posting is a separate step.', submit: 'Record decision', busy: 'Recording…',
      fields: [{ type: 'info', html: `<span>Certified ${hrs(s.certified)} · ${dtp.label}, ratio ×${dtp.ratio.toFixed(1)} (${esc(dtp.rule)})</span><span class="muted">${a ? 'COC balance ' + hrs(balance(a.id)) + ' of 120.0 h · ' + MON[parts(s.date)[1] - 1] + ' credits ' + hrs(monthCredits(s.emp, s.date)) + ' of 40.0 h' : 'No COC Account yet; posting COC opens one.'}</span>` },
        { name: 'method', type: 'radio', label: 'Method', options: [{ value: 'COC', label: 'COC', hint: 'Credits decided hours × ' + dtp.ratio.toFixed(1) + ' when posted', checked: !prior || prior.method === 'COC' }, { value: 'NON_COMPENSABLE', label: 'Non-compensable', hint: 'Records the decision; nothing is credited', checked: prior && prior.method === 'NON_COMPENSABLE' }, { value: 'OVERTIME_PAY', label: 'Overtime pay', hint: OT_PAY_REASON, disabled: true }] },
        { name: 'approved', label: 'Decided hours', type: 'number', step: '0.25', min: 0, value: s.certified, required: true, hint: 'At most the ' + hrs(s.certified) + ' certified' }],
      run(v) {
        const n = Number(v.approved);
        if (n > s.certified) return { refused: 'Decided hours can’t exceed the ' + hrs(s.certified) + ' certified.' };
        const superseded = prior ? prior.superseded.concat([{ method: prior.method, approved: prior.approved, by: prior.by, at: prior.at }]) : [];
        s.decision = { method: v.method, approved: n, ratio: dtp.ratio, credited: v.method === 'COC' ? n * dtp.ratio : 0, by: me().who, at: TODAY, entry: null, superseded };
        s.status = 'FOR_COMPENSATION'; log(s, (prior ? 'Superseded the decision: ' : 'Decided ') + METHOD[v.method]);
        return { message: 'Decided ' + METHOD[v.method] + (v.method === 'COC' ? ' (' + signed(n * dtp.ratio) + ', not posted)' : '') + ' for ' + svcLabel(s) + '.', hl: s.id };
      } });
  },
  'comp-post'(id) {
    const s = svc(id), d = s.decision;
    openDialog({ title: 'Post compensation · ' + svcLabel(s), desc: d.method === 'COC' ? 'Posting writes EARNED ' + signed(d.credited) + ' to ' + EMP[s.emp].name + '’s COC Account. A retry never posts twice.' : 'Posting closes the record as non-compensable. Nothing is credited.', submit: 'Post', busy: 'Posting…',
      run() {
        if (d.method === 'COC') {
          let a = acctOf(s.emp);
          if (!a) { a = { id: 'COC-' + EMP[s.emp].no.slice(2), emp: s.emp, status: 'ACTIVE', opened: TODAY }; D.accounts.push(a); }
          if (D.entries.some(e => e.svc === s.id && e.type === 'EARNED')) return { refused: 'This decision is already posted.' };
          const eid = 'E-0' + (300 + D.seq);
          D.entries.push({ id: eid, acct: a.id, type: 'EARNED', qty: d.credited, eff: s.date, posted: TODAY, svc: s.id, src: s.auth + ' · ' + dtw(s.date) + ' · ' + hrs(d.approved) + ' × ' + d.ratio.toFixed(1), expires: parts(s.date)[0] + 1 + '-12-31' });
          d.entry = eid;
        }
        d.postedBy = me().who; d.postedAt = TODAY; s.status = 'COMPENSATED'; log(s, d.method === 'COC' ? 'Posted EARNED ' + signed(d.credited) : 'Posted non-compensable');
        return { message: d.method === 'COC' ? 'Posted EARNED ' + signed(d.credited) + ' to ' + EMP[s.emp].name + '’s COC Account.' : 'Posted as non-compensable.', hl: s.id };
      } });
  },
  'coc-adjust'(id) {
    const a = acct(id);
    openDialog({ title: 'Adjust COC · ' + EMP[a.emp].name, desc: 'Adds an adjustment entry. Existing entries never change.', submit: 'Post adjustment', busy: 'Posting…',
      fields: [{ row: [{ name: 'qty', label: 'Hours (negative to reduce)', type: 'number', step: '0.25', required: true, value: '' }, { name: 'eff', label: 'Effective date', type: 'date', value: TODAY, max: TODAY, required: true }] }, { name: 'reason', label: 'Reason', type: 'textarea', required: true }, { name: 'evidence', label: 'Supporting authority or evidence', type: 'text', required: true, hint: 'Memo, correction, or decision reference' }],
      run(v) {
        const q = Number(v.qty); if (!q) return { refused: 'Enter a non-zero number of hours.' };
        if (balance(a.id) + q < 0) return { refused: 'The balance can’t go below zero (it is ' + hrs(balance(a.id)) + ').' };
        const eid = 'E-0' + (300 + D.seq); D.seq++;
        D.entries.push({ id: eid, acct: a.id, type: 'ADJUSTMENT', qty: q, eff: v.eff, posted: TODAY, reason: v.reason, evidence: v.evidence, by: me().who, expires: q > 0 ? (parts(v.eff)[0] + 1) + '-12-31' : undefined });
        return { message: 'Posted adjustment ' + signed(q) + '. Balance is now ' + hrs(balance(a.id)) + '.', hl: eid, go: { tab: 'ledger', asOf: TODAY } };
      } });
  },
  'coc-reverse'(id) {
    const e = entry(id), a = acct(e.acct);
    openDialog({ title: 'Reverse ' + id, desc: `Adds a reversal of ${signed(-e.qty)} linked to ${id}. The original entry stays in the ledger.`, submit: 'Post reversal', danger: true, busy: 'Posting…',
      fields: [{ name: 'reason', label: 'Reason', type: 'textarea', required: true }, { name: 'evidence', label: 'Supporting authority or evidence', type: 'text', required: true }],
      run(v) {
        if (reversalOf(id)) return { refused: id + ' is already reversed.' };
        if (balance(a.id) - e.qty < 0) return { refused: 'Reversing would take the balance below zero; ' + hrs(balance(a.id)) + ' remain.' };
        const rid = 'E-0' + (300 + D.seq); D.seq++;
        D.entries.push({ id: rid, acct: a.id, type: 'REVERSAL', qty: -e.qty, eff: TODAY, posted: TODAY, reverses: id, reason: v.reason, evidence: v.evidence, by: me().who });
        return { message: 'Reversed ' + id + ' with ' + rid + '. Balance is now ' + hrs(balance(a.id)) + '.', hl: rid, go: { asOf: TODAY } };
      } });
  },
  'cto-new'() {
    const a = acctOf(SELF);
    openDialog({ title: 'Request CTO', desc: 'CTO is taken in blocks of 4 or 8 hours (CSC-DBM JC 2, s. 2004, item 5.9.1). The request saves as a draft.', submit: 'Save draft', busy: 'Saving…',
      fields: [{ type: 'info', html: `<strong>Available COC: ${hrs(available(SELF))}</strong><span class="muted">Balance ${hrs(balance(a.id))} less ${hrs(committed(SELF))} committed to approved CTO</span>` }, { row: [{ name: 'date', label: 'CTO date', type: 'date', value: '2026-11-20', min: TODAY, required: true }, { name: 'block', label: 'Block', type: 'select', value: 'DAY', options: Object.entries(BLOCK).map(([k, [l, n]]) => ({ value: k, label: l + ' · ' + n + ' h' })) }] }],
      run(v) {
        const id = 'CTO-2026-0' + (47 + D.ctos.filter(c => c.id >= 'CTO-2026-047').length);
        const c = { id, emp: SELF, date: v.date, block: v.block, requested: BLOCK[v.block][1], status: 'DRAFT', history: [] };
        log(c, 'Saved the draft'); D.ctos.unshift(c);
        return { message: id + ' saved as a draft. Submit it when ready.', go: { dest: 'cto', view: 'form', record: id, tab: '' } };
      } });
  },
  'cto-submit'(id) { const c = cto(id); openDialog({ title: 'Submit ' + id, desc: 'Your Supervisor recommends or returns it; the Approving Official decides. COC is committed only on approval.', submit: 'Submit', busy: 'Submitting…', run() { c.status = 'SUBMITTED'; c.returnNote = null; log(c, 'Submitted'); return { message: id + ' submitted to your Supervisor.' }; } }); },
  'cto-recommend'(id) { const c = cto(id); openDialog({ title: 'Recommend ' + id, desc: EMP[c.emp].name + ' · ' + dtw(c.date) + ' · ' + hrs(c.requested) + '. Available COC: ' + hrs(available(c.emp)) + '.', submit: 'Recommend', busy: 'Recommending…', fields: [{ name: 'note', label: 'Service coverage note', type: 'text', value: '' }], run(v) { c.status = 'FOR_APPROVAL'; c.recommendedBy = me().who; c.recommendedAt = TODAY; log(c, 'Recommended', v.note); return { message: id + ' recommended to the Approving Official.' }; } }); },
  'cto-return'(id) { const c = cto(id); openDialog({ title: 'Return ' + id, desc: 'The request goes back to the Employee as a draft.', submit: 'Return', busy: 'Returning…', fields: [{ name: 'note', label: 'Comment', type: 'textarea', required: true }], run(v) { c.status = 'DRAFT'; c.returnNote = v.note; log(c, 'Returned', v.note); return { message: id + ' returned to ' + EMP[c.emp].name + '.' }; } }); },
  'cto-approve'(id) {
    const c = cto(id);
    openDialog({ title: 'Approve ' + id, desc: 'Available COC is rechecked now. Approval commits ' + hrs(c.requested) + '; the balance changes only when CTO is posted.', submit: 'Approve', busy: 'Approving…',
      fields: [{ type: 'info', html: `<span>${esc(EMP[c.emp].name)} · ${dtw(c.date)} · ${hrs(c.requested)}</span><span class="muted">Available now: ${hrs(available(c.emp))}</span>` }],
      run() { const av = available(c.emp); if (c.requested > av) return { refused: 'Available COC is ' + hrs(av) + '; this request needs ' + hrs(c.requested) + '.' }; c.status = 'APPROVED'; c.approved = c.requested; c.approvedBy = me().who; c.approvedAt = TODAY; log(c, 'Approved ' + hrs(c.approved)); return { message: id + ' approved. ' + hrs(c.approved) + ' committed.' }; } });
  },
  'cto-reject'(id) { const c = cto(id); openDialog({ title: 'Reject ' + id, desc: 'The Employee sees your reason.', submit: 'Reject', danger: true, busy: 'Rejecting…', fields: [{ name: 'reason', label: 'Reason', type: 'textarea', required: true }], run(v) { c.status = 'REJECTED'; c.rejectReason = v.reason; log(c, 'Rejected', v.reason); return { message: id + ' rejected.' }; } }); },
  'cto-post'(id) {
    const c = cto(id);
    openDialog({ title: 'Post ' + id, desc: 'Posting writes USED ' + signed(-c.approved) + ' and the CTO input on the Attendance Day of ' + dt(c.date) + ' together.', submit: 'Post', busy: 'Posting…',
      run() {
        if (c.date > TODAY) return { refused: 'CTO can be posted on or after ' + dt(c.date) + '.' };
        if (c.date <= LOCKED_THROUGH) return { refused: 'Attendance for ' + dt(c.date) + ' is locked.' };
        if (c.approved > balance(acctOf(c.emp).id)) return { refused: 'The COC balance is ' + hrs(balance(acctOf(c.emp).id)) + '.' };
        const eid = 'E-0' + (300 + D.seq); D.entries.push({ id: eid, acct: acctOf(c.emp).id, type: 'USED', qty: -c.approved, eff: c.date, posted: TODAY, cto: c.id });
        c.entry = eid; c.status = 'POSTED'; c.postedBy = me().who; c.postedAt = TODAY; log(c, 'Posted USED ' + signed(-c.approved) + ' and the Attendance input');
        return { message: id + ' posted.' };
      } });
  },
  'cto-cancel'(id) {
    const c = cto(id);
    const locked = c.status === 'POSTED' && c.date <= LOCKED_THROUGH;
    const desc = c.status === 'DRAFT' ? 'The draft closes.' : c.status === 'APPROVED' ? 'Releases the ' + hrs(c.approved) + ' commitment. Nothing was deducted.' : locked ? dt(c.date) + ' is in a locked Attendance period. Cancelling sends a Locked Attendance Adjustment; COC is restored only after Attendance authorizes it.' : 'Reverses the USED entry and voids the CTO input on ' + dt(c.date) + ' together.';
    openDialog({ title: 'Cancel ' + id, desc, submit: 'Cancel CTO', danger: true, busy: 'Cancelling…', fields: c.status === 'DRAFT' ? [] : [{ name: 'reason', label: 'Reason', type: 'textarea', required: true }],
      run(v) {
        if (c.status === 'DRAFT' || c.status === 'APPROVED') { c.wasApproved = c.status === 'APPROVED'; c.status = 'CANCELLED'; log(c, 'Cancelled', v.reason); return { message: id + ' cancelled.' + (c.wasApproved ? ' Commitment released.' : '') }; }
        if (locked) { c.cancellation = { state: 'AWAITING', by: me().who, at: TODAY, ref: 'LAA-2026-0' + (20 + (D.seq % 70)), reason: v.reason }; log(c, 'Cancelled posted CTO on a locked date', v.reason); return { message: 'Cancellation sent to Attendance as ' + c.cancellation.ref + '. It completes when Attendance authorizes it.', go: { tab: 'attendance' } }; }
        const rid = 'E-0' + (300 + D.seq); D.seq++;
        D.entries.push({ id: rid, acct: acctOf(c.emp).id, type: 'REVERSAL', qty: c.approved, eff: TODAY, posted: TODAY, reverses: c.entry, reason: 'Cancelled ' + id + ': ' + v.reason, evidence: id, by: me().who });
        c.status = 'CANCELLED'; c.reversal = rid; c.voided = true; log(c, 'Cancelled posted CTO', v.reason);
        return { message: id + ' cancelled. ' + signed(c.approved) + ' restored by ' + rid + ' and the Attendance input voided.' };
      } });
  },
};

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-go],[data-view],[data-tab],[data-nav],[data-sample]');
  if (!t || t.closest('dialog')) return;
  if (t.dataset.nav) { if (ev.metaKey || ev.ctrlKey || ev.shiftKey) return; ev.preventDefault(); S.navOpen = false; go({ dest: t.dataset.nav, view: 'tree', record: '', asOf: TODAY }); return; }
  if (t.dataset.go) { const o = JSON.parse(t.dataset.go); if (o.dest === 'coc') S.asOf = TODAY; go(o, 'authFilter' in o); return; }
  if (t.dataset.view) { go({ view: t.dataset.view }); return; }
  if (t.dataset.tab) { S.focus = 'tab-' + t.dataset.tab; go({ tab: t.dataset.tab, noScroll: true }); return; }
  if (t.dataset.sample) { go({ sample: t.dataset.sample }); return; }
  if (t.dataset.act && ACTIONS[t.dataset.act]) ACTIONS[t.dataset.act](t.dataset.id);
});
document.addEventListener('keydown', ev => {
  const t = ev.target;
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(ev.key)) {
    const all = [...t.parentElement.querySelectorAll('[role=tab]')]; const i = all.indexOf(t);
    const n = ev.key === 'Home' ? 0 : ev.key === 'End' ? all.length - 1 : (i + (ev.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length;
    ev.preventDefault(); S.focus = 'tab-' + all[n].dataset.tab; go({ tab: all[n].dataset.tab, noScroll: true });
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.filter === 'q') { S.q = t.value; render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.closest('dialog')) return;
  if (t.dataset.filter && t.dataset.filter !== 'q') { S[t.dataset.filter] = t.value; render(); }
  if ('role' in t.dataset) {
    const r = ROLES[t.value];
    const dest = r.can.includes(DESTS[S.dest].perm) ? S.dest : NAV.find(x => r.can.includes(DESTS[x].perm)) || S.dest;
    S.focus = 'role'; go({ role: t.value, dest, view: S.view === 'form' ? 'tree' : S.view, record: '', tab: '', noScroll: true });
  }
  if ('samplesel' in t.dataset) { S.focus = 'sample'; go({ sample: t.value, noScroll: true }); }
  if ('asof' in t.dataset) { S.asOf = t.value && t.value <= TODAY ? t.value : TODAY; S.hl = null; render(); }
});
window.addEventListener('popstate', () => { readUrl(); S.flash = null; render(); });
readUrl();
render();
</script>
</body>
</html>
