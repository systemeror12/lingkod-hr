services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: hris
      POSTGRES_USER: hris_local
      POSTGRES_PASSWORD: local_only
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init/001-runtime-roles.sql:/docker-entrypoint-initdb.d/001-runtime-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hris_local -d hris']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.26
    environment:
      AWS_ACCESS_KEY_ID: lingkod_local
      AWS_SECRET_ACCESS_KEY: lingkod_local_secret
      S3_BUCKET: hris-local
    command: ['mini', '-dir=/data']
    ports:
      - '8333:8333'
      - '9333:9333'
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:8333/status >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8025/livez']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
